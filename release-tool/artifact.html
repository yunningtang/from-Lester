<style>
/* Layout: a single phone-sized column; the orb is the centre of gravity. Glass only on the floating tab bar and the check-in banner. */
:root{

  --accent:#63c2ab; --accent-ink:#0b1311; --accent-wash:rgba(99,194,171,.13); --tile:#1b2b26; --tile-ink:#bfe6d8;

.ping{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;width:min(560px,calc(100% - 24px));border-radius:22px;padding:14px;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px var(--line),0 8px 16px var(--shade);display:flex;flex-direction:column;gap:10px;animation:down .35s var(--ease) both}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .orbbtn .lbl{color:#0b1311;text-shadow:none}}
:root[data-theme="dark"] .orbbtn .lbl{color:#0b1311;text-shadow:none}
/* motion */
.wave{position:fixed;border-radius:50%;pointer-events:none;z-index:45;box-shadow:inset 0 0 0 2px var(--orb-2);transform:translate(-50%,-50%) scale(.7);opacity:.9;animation:ripple 1.4s var(--ease) forwards}

<script>
(function(){
const QUOTES=[{"q":"最基本的就是持续释放。","c":"The Way","t":"Lesson 2 · 2-2","p":9},{"q":"你们有没有特别注意去持续释放欲望，放走更多、放走更多、放走更多，直到没有更多？","c":"The Right Path","t":"开篇","p":45},{"q":"你会审视每一个出现的感受，看到它是想要被认同、想要控制、还是想要安全，然后让它离开。","c":"百年纪念","t":"1983 年在圣多纳的谈话","p":243},{"q":"所以当你去做，这是非常轻松容易的，它们就像波浪一样浮现并离开，直到波浪停止，你也就完成了。","c":"The Way","t":"Lesson 1","p":1},{"q":"从现在开始，任何你想要的东西，都通过释放来得到它。","c":"The Way","t":"Lesson 1","p":1},{"q":"一开始可能是一天抽出一小时，然后是早上的一个小时和晚上的一个小时，接着是几个小时，然后是半天，最后你会花上一整天时间。","c":"莱斯特·利文森的私教课","t":"没有限制 Part 2","p":115},{"q":"让心智完全安静下来，就是这么简单。","c":"莱斯特·利文森的私教课","t":"释放对自由的抗拒 Part 1","p":95},{"q":"当它开始浮现，请让它离开。","c":"The Way","t":"Lesson 4","p":18},{"q":"你现在就是完全自由的，你是全能的，你是全知的，你是全在的。","c":"The Way","t":"Lesson 5","p":22},{"q":"如果你觉得累了，就释放“想要改变疲惫”，你就会恢复精力。","c":"莱斯特·利文森静修会","t":"2-2","p":140},{"q":"释放“想要改变这个模糊不清的感受”","c":"The Way","t":"Lesson 1","p":1},{"q":"当你释放了那些，在它们底端的“对死亡的恐惧”，就会自然地、明显可察觉地浮现出来，给你去释放。","c":"The Way","t":"Lesson 1","p":1},{"q":"你设置了一个缺乏、想要、欲望去搅动你的心智，当你填补了这个欲望，心智变得安静起来，从而你仅仅是存在时，这就是你所感觉到的快乐","c":"The Way","t":"Lesson 5","p":22},{"q":"你必须想要自由超过你想要这个世界。","c":"The Way","t":"Lesson 1","p":1},{"q":"无论你想要什么，仅仅通过释放来得到，我把“仅仅”这个词划重点。","c":"The Way","t":"Lesson 1","p":1},{"q":"感受并不会咬你、不会对你开枪、不会击中你的头。","c":"The Way","t":"Lesson 1","p":1},{"q":"抛出这些“为什么”实际上是在刻意逃避做释放。","c":"The Way","t":"Lesson 1","p":1},{"q":"当你释放了，你会体验到自己不是行为者的感觉。","c":"The Way","t":"Lesson 3","p":14},{"q":"这不是强迫自己，而是一种放手，让它是的感觉。","c":"The Way","t":"Lesson 3","p":14},{"q":"因为每一分被压抑的感受都在压力下想要消耗它自己。","c":"The Way","t":"Lesson 4","p":18},{"q":"你必须想要自由超过你想要世界。","c":"The Way","t":"Lesson 5","p":22},{"q":"横在你和你的终极幸福之间的唯一事物就是被压抑着的感受。","c":"The Way","t":"Lesson 6 · 6-1","p":28},{"q":"每一个关于爱的感受都是“非爱的感受”。","c":"The Way","t":"Lesson 6 · 6-1","p":28},{"q":"心智是你构建起来的东西，它是你所有念头和感受的总和。","c":"The Way","t":"Lesson 6 · 6-1","p":28},{"q":"所以，我们再一次想要它的事实证明了我们从未满足过它。","c":"The Way","t":"Lesson 6 · 6-3","p":38},{"q":"如果我真的想要它，我会放下一切，并只管去做。","c":"The Way","t":"Lesson 6 · 6-3","p":38},{"q":"但感受只是程序而已，是我们对外部世界做出反应的潜意识自动化程序。","c":"The Right Path","t":"与莱斯特的谈话 第一卷","p":55},{"q":"每一个感受都是为了维持身体的生存而作为一种生存程序被植入的。","c":"The Right Path","t":"与莱斯特的谈话 第一卷","p":55},{"q":"每一个不可能，无论多么不可能，当我们对它完全释放时，都会立即变成可能","c":"The Right Path","t":"与莱斯特的谈话 第一卷","p":55},{"q":"以无欲为目标，以释放你所有的欲望为目标","c":"The Right Path","t":"与莱斯特的谈话 第一卷","p":55},{"q":"欲望是一种匮乏的痛苦，放下对拥有它的欲望，这会暂时让我们的心智安静下来，在那一刻，我们只是存在。","c":"The Right Path","t":"与莱斯特的谈话 第二卷","p":62},{"q":"无论你想要什么，在这里实现的最慢。","c":"The Right Path","t":"第三、四卷 · 分离","p":76},{"q":"随着你放手，随着你释放，随着你脱离身体，你的存在会不断扩展，直到最终，你仅仅只是你的存在。","c":"The Right Path","t":"第三、四卷 · 分离","p":76},{"q":"每一个感受都是为了这个物理身体，作为生存程序被放入的，但是每个感受实际上都是反生存的。","c":"The Right Path","t":"第三、四卷 · 获得自由","p":79},{"q":"不再有感受，你的心智就安静了，你的真我就会显现。","c":"The Right Path","t":"第三、四卷 · 获得自由","p":79},{"q":"对死亡的恐惧也仅仅只是一种感受罢了，事实是你不会死。","c":"The Right Path","t":"第三、四卷 · 给予","p":81},{"q":"释放对死亡的恐惧，下一步释放与“一”的分离感就没那么困难了。","c":"The Right Path","t":"第三、四卷 · 小我","p":83},{"q":"大多数人释放是为了把这个世界变成一个更好的世界","c":"The Right Path","t":"第三、四卷 · 通往顶端的路","p":83},{"q":"不是因为那个人帮你满足了你的欲望，所以你的心智变得安静了，而是心智安静下来了，这就是快乐。","c":"庆祝莱斯特 100 周年纪念日","t":"开篇","p":85},{"q":"你必须想要自由超过想要世界上的任何其他事物。","c":"庆祝莱斯特 100 周年纪念日","t":"开篇","p":85},{"q":"不要再到它所不在的地方寻找了，发现你的快乐是什么——当你的心智安静下来，你就只是存在。","c":"庆祝莱斯特 100 周年纪念日","t":"想要自由","p":87},{"q":"你释放得越多，你就能释放越多，你就越能往下深入并拉出更沉重的垃圾","c":"庆祝莱斯特 100 周年纪念日","t":"想要自由","p":87},{"q":"我们的垃圾闻起来很香，我们已经习惯了，我们不想释放它","c":"庆祝莱斯特 100 周年纪念日","t":"自由状态","p":87},{"q":"所以，好好利用这个世界的沉重吧，释放它，直到没有任何沉重。","c":"庆祝莱斯特 100 周年纪念日","t":"自由状态","p":87},{"q":"如果你想知道它是什么样子，释放所有的限制，你就会看到。","c":"庆祝莱斯特 100 周年纪念日","t":"全在","p":90},{"q":"一天 24 小时，你都在为了生存而处于守卫状态，当你想要生存时，你的心智永远都不会安静下来，一直都是生死攸关。","c":"庆祝莱斯特 100 周年纪念日","t":"身体和心智","p":91},{"q":"真正的底线是对死亡的恐惧，当这些感受出现时，释放它们，直到不再有任何对死亡的恐惧。","c":"庆祝莱斯特 100 周年纪念日","t":"对死亡的恐惧","p":91},{"q":"如果你被淹没了，释放认同和控制，直到你能够面对你对死亡的恐惧。","c":"庆祝莱斯特 100 周年纪念日","t":"对死亡的恐惧","p":91},{"q":"释放它，你就超越了业力，你不是在解决它。","c":"庆祝莱斯特 100 周年纪念日","t":"关于业力","p":92},{"q":"你只是纯粹地想让他们得到他们想要的","c":"庆祝莱斯特 100 周年纪念日","t":"家人与释放","p":92},{"q":"你必须想要它超过你想要世界上的任何事","c":"庆祝莱斯特 100 周年纪念日","t":"获得自由","p":93},{"q":"每个人都拥有他或她想要的东西，你喜欢自己所拥有的吗？","c":"庆祝莱斯特 100 周年纪念日","t":"获得自由","p":93},{"q":"它是你的心智，是你让它变得嘈杂，你可以让它安静下来。","c":"莱斯特·利文森的私教课","t":"释放对自由的抗拒 Part 1","p":95},{"q":"心智永远无法让心智安静。因为心智是错误地寻求生存、安全、认同和控制的机制","c":"莱斯特·利文森的私教课","t":"释放对自由的抗拒 Part 2","p":96},{"q":"让感受浮现出来，觉察它们下面的想要被认同或想要控制，然后让它们出去。","c":"莱斯特·利文森的私教课","t":"释放对自由的抗拒 Part 2","p":96},{"q":"心智是一个非常简单的东西，它就是我们所有念头和感受的总和。","c":"莱斯特·利文森的私教课","t":"释放对自由的抗拒 Part 3","p":98},{"q":"释放获取知识的尝试，所有的知识都是分离的。真正的知识不是知识，是存在。","c":"莱斯特·利文森的私教课","t":"你能做任何事 Part 2","p":101},{"q":"你所有的想要都必须集中于“想要自由”，那么，你会在几个月内得到它。","c":"莱斯特·利文森的私教课","t":"你能做任何事 Part 3","p":102},{"q":"你怎样让心智安静呢？通过释放心智的驱动，也就是感受。","c":"莱斯特·利文森的私教课","t":"你不是身体和心智 Part 1","p":104},{"q":"在你释放相当的认同和控制之前，你无法直面自己对死亡的恐惧，它在你的内心是如此深沉、如此沉重。","c":"莱斯特·利文森的私教课","t":"你不是身体和心智 Part 3","p":107},{"q":"你利用这个世界来激起、带出感受，这样你就能释放它们。","c":"莱斯特·利文森的私教课","t":"获得自由 Part 1","p":109},{"q":"针对你的目标做释放是好的，不是为了追逐它们，而是为了让阻碍的感受浮现出来，这样你就可以释放那些感受。","c":"莱斯特·利文森的私教课","t":"获得自由 Part 1","p":109},{"q":"你生命中所做的每一件事都是在浪费时间，除了释放。","c":"莱斯特·利文森的私教课","t":"获得自由 Part 1","p":109},{"q":"问问你自己“为什么我不让它持续，并在几周内走完全程呢？”","c":"莱斯特·利文森的私教课","t":"获得自由 Part 2","p":111},{"q":"如果你释放那些障碍、那些感受，你能够拥有、成为、做任何你想做或想要的。","c":"莱斯特·利文森的私教课","t":"获得自由 Part 3","p":112},{"q":"你要做的是认识到你有多不想要这个自由状态，这是你必须做的第一件事，你必须面对它。","c":"莱斯特·利文森的私教课","t":"终极自由 Part 2","p":120},{"q":"而唯一能让你活在当下的方式就是不带有任何感受。","c":"莱斯特·利文森静修会","t":"1-1","p":125},{"q":"身体只不过是一台垃圾制造机，每个人都知道它不会永远运转下去，但我们都在试图让它无限期地持续下去。","c":"莱斯特·利文森静修会","t":"1-2","p":129},{"q":"这很简单，摆脱你的感受，你就会一直处于顶端。","c":"莱斯特·利文森静修会","t":"1-2","p":129},{"q":"所以我说，停止追逐彩虹，停止创造匮乏，这就是所谓的“欲望”，立刻释放那个匮乏的痛苦，只是做你自己。","c":"莱斯特·利文森静修会","t":"2-1","p":135},{"q":"安静心智就是摆脱思考的驱动，即感受。","c":"莱斯特·利文森静修会","t":"2-1","p":135},{"q":"现在释放这些程序其实是在解除小我程序。小我是我们所有程序的总和。","c":"莱斯特·利文森静修会","t":"3-1","p":145},{"q":"正如我们所知道的，控制并不是一个不好的词，也不是一件坏事情，“想要”才是。","c":"莱斯特·利文森静修会","t":"3-2","p":151},{"q":"更具体地说，业力就是程序。基本的程序是感受，而最基本的程序就是分离的感受。","c":"莱斯特·利文森静修会","t":"3-2","p":151},{"q":"倾向是一种惯性、是一种感受，它是一种感受，倾向从时间伊始就建立起来了","c":"与莱斯特的炉边漫谈","t":"寻找幸福 2","p":159},{"q":"你必须释放 “我不能”，因为如果你认为自己做不到，事情就会如你所想的那样发展。","c":"与莱斯特的炉边漫谈","t":"寻找幸福 3","p":160},{"q":"引导员的技能是让他们处理一个感受，让那个感受浮现出来","c":"与莱斯特的炉边漫谈","t":"活在当下 1","p":162},{"q":"如果你陷入低谷时，直面那个感受","c":"与莱斯特的炉边漫谈","t":"活在当下 1","p":162},{"q":"通过直面我的感受，引发焦虑的根源就很清晰地呈现出来了，根本不需要思考探究它","c":"与莱斯特的炉边漫谈","t":"活在当下 1","p":162},{"q":"直面一个感受就是将一个感受追溯到一个更基本的感受，直到你感受到根源的感受——想要控制或想要被认同。","c":"与莱斯特的炉边漫谈","t":"活在当下 2","p":163},{"q":"在心智中坚持你想要的，然后带着它已经完成了的感觉放手。","c":"与莱斯特的炉边漫谈","t":"贪恋与厌恶 Attachments and Aversions 1","p":165},{"q":"当你放下想法时，那种存在的感觉一直在那里，是想法覆盖了它。","c":"与莱斯特的炉边漫谈","t":"贪恋与厌恶 Attachments and Aversions 2","p":167},{"q":"除了缺乏爱的感受以外，不存在任何情绪，仅此而已。","c":"与莱斯特的炉边漫谈","t":"摆脱自身限制 Riding Yourself of Limitations 2","p":171},{"q":"一个人只有去爱，才能感受到爱。","c":"与莱斯特的炉边漫谈","t":"沟通与爱 3","p":177},{"q":"所以，（完全释放)之前我们是感受的奴隶，之后感受是我们的奴隶。","c":"与莱斯特的炉边漫谈","t":"关于释放","p":181},{"q":"通过触及它背后的基础感受，并消除基础感受，因此，通过切断根","c":"与莱斯特的炉边漫谈","t":"关于释放","p":181},{"q":"我们基本的固有的本质都是爱，仅仅是爱，它被我们压抑的感受覆盖和抑制了。","c":"与莱斯特的炉边漫谈","t":"关于释放","p":181},{"q":"你的心智是你所有想法和感受的总和。","c":"与莱斯特的炉边漫谈","t":"展示波澜不惊 1","p":182},{"q":"让它们上来，然后真正地把它们倒掉。","c":"与莱斯特的炉边漫谈","t":"展示波澜不惊 1","p":182},{"q":"当潜意识感受不再阻碍我们时，我们就能完全掌控自己的感受。","c":"与莱斯特的炉边漫谈","t":"展示波澜不惊 2","p":185},{"q":"我已经使用了释放法，我到达了生活中没有任何问题的状态","c":"与莱斯特的炉边漫谈","t":"展示波澜不惊 3","p":187},{"q":"思考是由强迫引发的。我们的感受驱动了我们的想法。","c":"与莱斯特的炉边漫谈","t":"展示波澜不惊 5","p":191},{"q":"当你的心智是平静到没有任何想法时，这就是终极状态，除非你想要放入一个想法。","c":"与莱斯特的炉边漫谈","t":"展示波澜不惊 5","p":191},{"q":"爱其实是我们最基本的天性，所有这些潜意识的感受掩盖了它。","c":"与莱斯特的炉边漫谈","t":"展示波澜不惊 5","p":191},{"q":"我们的思考是由我们的感受驱动的","c":"百年纪念","t":"发展释放法","p":197},{"q":"测试意味着怀疑，而只要有任何怀疑存在，任何怀疑都会让它失效。","c":"百年纪念","t":"莱斯特的觉醒","p":203},{"q":"每一个幸福的感受都是在感受真我，真我是唯一存在的幸福。","c":"百年纪念","t":"主人身份","p":212},{"q":"她想要的不过是让我说出那个能解决她世俗问题的咒语，我无法做到，也没人能做到。","c":"百年纪念","t":"老师和学生","p":215},{"q":"真正要做的是——释放对事物、对人的渴望。","c":"百年纪念","t":"积极的想法和欲望","p":219},{"q":"每次我们这么做，我们把潜意识的想法变成有意识的，然后有意识地释放它。","c":"百年纪念","t":"我是谁","p":235},{"q":"所以方法就是让“我是什么？”那个问题继续下去，当干扰的念头出现时，看着它，然后释放它。","c":"百年纪念","t":"自由的时间","p":237},{"q":"现在我释放了它，因为我发现我的安全在于我有随时创造财富的能力。","c":"百年纪念","t":"实现丰盛（屁股系统）","p":239},{"q":"我的建议是你现在就这么做，想一想就让事情发生，就像你找到一个停车位一样，在你想要的一切上去实践。","c":"百年纪念","t":"冲突","p":240},{"q":"每一个感受都是一个对生存的驱动程序。","c":"百年纪念","t":"1983 年在圣多纳的谈话","p":243},{"q":"其实很容易，除非你让它变得困难。","c":"百年纪念","t":"动能","p":245},{"q":"当你首先意识到你真的不接受它，如果你直面这一点，你就能更好地释放它。","c":"百年纪念","t":"动能","p":245},{"q":"但区别在于感受不会再运作你，而是你运作着感受。","c":"百年纪念","t":"莱斯特关于心智","p":248},{"q":"每一个不可能，无论多么不可能，当你对任何事物完全释放之后，都会立即变成可能。","c":"百年纪念","t":"医学","p":256},{"q":"无论你想要的是什么，当你不再担心它的时候，你就知道你已经完全释放了。","c":"百年纪念","t":"医学","p":256},{"q":"无论多么不可能，相信我，无论情况多么不可能，当你完全释放时，它会立即成为可能。","c":"百年纪念","t":"显化物质","p":259},{"q":"所以我们告诉你，设定你的目标，摆脱障碍，摆脱阻碍你实现目标的那些感受，并释放它们","c":"百年纪念","t":"大师与古茹","p":259},{"q":"要知道，想要被认同、控制、安全是导致所有思考的根源。","c":"百年纪念","t":"负起责任","p":261},{"q":"释放一个单位的认同或控制就是释放那个单位之下的每一个感受。","c":"百年纪念","t":"负起责任","p":261},{"q":"你释放了对死亡的恐惧，你就结束了，你离成功很近了，快完成了。","c":"百年纪念","t":"对死亡的恐惧","p":262},{"q":"看看你们的心智有多嘈杂，所以专注于释放认同、控制，这是唯一能帮到你的事情。","c":"百年纪念","t":"不做奴隶","p":265},{"q":"但如果你在我和你说话的时候释放认同和控制，你就能继续前进。","c":"百年纪念","t":"不做奴隶","p":265},{"q":"我会把第一步从“你必须想要自由超过想要被认同和想要控制”改成“你必须想要自由超过想要这个世界上的任何其他东西”。","c":"百年纪念","t":"莱斯特最后的话","p":265},{"q":"所做的事很简单——每一个感受，觉察它，让它出去。","c":"百年纪念","t":"莱斯特最后的话","p":265},{"q":"释放你对死亡的恐惧，你会发现你是永恒的，你完全掌控着你的宇宙。","c":"百年纪念","t":"莱斯特最后的话","p":265},{"q":"如果我是无限的“一”，我便什么也不想要，我是一切。","c":"终极目标第一卷","t":"终极真理 2","p":270},{"q":"所有幸福都是你内在真我的感受，幸福就是如此。","c":"终极目标第一卷","t":"体验真理 1","p":272},{"q":"一、看到我们所是的这个无限存在；二、看到我们强加在它之上的限制，并释放它们。","c":"终极目标第一卷","t":"释放小我 1","p":275},{"q":"所以成长仅仅在于释放我们的小我。","c":"终极目标第一卷","t":"释放小我 2","p":277},{"q":"每当我们被小我驱动时，如果我们释放它，我们就是在释放一点小我。","c":"终极目标第一卷","t":"释放小我 2","p":277},{"q":"每当你感受到幸福的时候，你或多或少都是在感受你的真我","c":"终极目标第一卷","t":"完美的身体 1","p":280},{"q":"带着一个放手的意愿，仅仅是带着放手的意愿，你就释放了一点小我。","c":"终极目标第一卷","t":"心镜 1","p":284},{"q":"所以我说，我们感受到的所有快乐都源于真我，我们感受到的所有痛苦都源于小我。","c":"终极目标第一卷","t":"心镜 2","p":286},{"q":"想着你想要的，你就只会得到你想要的。","c":"终极目标第一卷","t":"创造你想要的一切 2","p":295},{"q":"我们应该放手，让上帝接手，让无限找到把我们想要的东西带给我们的方式。","c":"终极目标第一卷","t":"创造你想要的一切 3","p":296},{"q":"任何带有未来概念的显化行为，都会让它永远地停留在未来。","c":"终极目标第一卷","t":"创造你想要的一切 3","p":296},{"q":"如果我们想要完全觉醒，就必须对发生在我们身上的一切负起全部责任。","c":"终极目标第一卷","t":"静默、爱和恩典 3","p":305},{"q":"我们必须变得更加普世，我们应该放下我们自己的生活，到我们能更多地为他人而活的程度。","c":"终极目标第一卷","t":"拥有一切 1","p":306},{"q":"完全接纳这个宇宙就是完全的自由，这意味着接纳它本来的样子，让它是它所是的样子，除了你自己，不想改变任何东西。","c":"终极目标第一卷","t":"个人达成自由的关键 3","p":312},{"q":"我相信如果我能做到，任何人都可以做到，只要他们有强烈的想要。","c":"终极目标第一卷","t":"莱斯特的发现 1","p":313},{"q":"我们所有的感受都被自动设定为维持我们生存下去的程序","c":"终极目标第一卷","t":"莱斯特的发现 2","p":316},{"q":"仅仅只是因为，为了感受到爱，你必须去爱，这是一扇通往幸福的奇妙之门。","c":"终极目标第二卷","t":"幸福就是爱 1","p":319},{"q":"只有在你停止思考的瞬间，你才能感受到你的真我。","c":"终极目标第二卷","t":"答案一直在这里 2","p":339},{"q":"持续出离的方法就是每天释放小我，并且每天更多地处于真我的觉知中。","c":"终极目标第二卷","t":"答案一直在这里 2","p":339},{"q":"如果我们说我们无法放手，那是因为我们真的不想放手，释放痛苦的渴望还不够强烈。","c":"终极目标第二卷","t":"不存在任何问题 1","p":343},{"q":"所以释放认同或控制的效果比仅仅释放愤怒要强数百倍。","c":"终极目标第二卷","t":"不存在任何问题 2","p":349},{"q":"因为欲望是无法满足的，只有释放它才行得通。","c":"终极目标第二卷","t":"不存在任何问题 2","p":349},{"q":"当你释放时，你就是在上升；当垃圾起作用时，你就会陷进去。","c":"终极目标第二卷","t":"成为你之所是的步骤 1","p":355},{"q":"满足欲望是不可能的，释放它才是完全可行的。","c":"终极目标第二卷","t":"成为你之所是的步骤 1","p":355},{"q":"所以如果你能养成一种习惯，即：留意到你体验到的所有幸福的感受，都出现在你安静下来并只是存在的时候。","c":"终极目标第二卷","t":"成为你之所是的步骤 2","p":359},{"q":"但请记住，当你释放时，你并没有放弃任何东西，反而收获更多。","c":"终极目标第二卷","t":"存在 Beingness 1","p":363},{"q":"这一点你应该用大写字母写在你的笔记里：在高处时释放，升到高处继续释放。","c":"终极目标第二卷","t":"存在 Beingness 2","p":369},{"q":"这就是我想要表达的重点，当你是和谐的，一切就都是完美的。","c":"莱斯特的存在课程第一卷","t":"摆脱错觉","p":374},{"q":"因为你想要认同的原因是为了让自己感到安全，那么你就不会死。","c":"莱斯特的存在课程第一卷","t":"对死亡的恐惧","p":387},{"q":"而且它只是一个感受，但你现在却把它等同于死亡本身，这就是为什么你不允许它出现的原因。","c":"莱斯特的存在课程第一卷","t":"对死亡的恐惧","p":387},{"q":"成长只有一种单一的方式，那就是放下我们的小我。","c":"莱斯特的存在课程第一卷","t":"目标","p":390},{"q":"当你入睡时，你放下了这个世界，对你而言，它消失了。","c":"莱斯特杂谈","t":"关于睡眠与觉醒 Part 1","p":432},{"q":"本课程的第一条警句是：放下所有的欲望等同于放下所有的想法。","c":"莱斯特杂谈","t":"放下欲望","p":436},{"q":"只想着你想要的，你就会一直得到你想要的。","c":"莱斯特杂谈","t":"莱斯特谈意愿力量 1","p":437},{"q":"别做一具身体，认同你的存在，你说“你是”，认同这一点，放下对身体的认同，这就是它的全部了。","c":"莱斯特杂谈","t":"超越欲望","p":467},{"q":"你可以不用得到那个人或物就能释放掉那些念头，然后你就会立即快乐起来。","c":"莱斯特杂谈","t":"幸福在哪里","p":469},{"q":"幸福不过是感受你真正无限的真我，仅此而已。","c":"莱斯特杂谈","t":"莱斯特谈悲伤 1","p":484},{"q":"当你试图逃避疼痛的时候，反而让它变得更真实了。","c":"莱斯特杂谈","t":"莱斯特谈疼痛是什么 1","p":490},{"q":"但我会做的是，我会深入其中去感受它，然后当你感受到它的那一刻，它便消失了。","c":"莱斯特杂谈","t":"莱斯特谈疼痛是什么 1","p":490},{"q":"但我向你保证，如果你感受这个疼痛，它会消失。","c":"莱斯特杂谈","t":"莱斯特谈疼痛是什么 2（有引导）","p":491},{"q":"我们所感受到的疼痛存在于我们的心智之中，它完全是心理上的。","c":"莱斯特杂谈","t":"莱斯特谈疼痛是什么 2（有引导）","p":491},{"q":"如果我不想要香蕉，而我的心智中正抓着香蕉不放，那么我会得到香蕉。","c":"莱斯特杂谈","t":"莱斯特谈疼痛是什么 3","p":493},{"q":"无论你害怕什么，你都会让它降临到自己身上。","c":"莱斯特杂谈","t":"莱斯特谈疼痛是什么 3","p":493}];
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('rel:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('rel:'+k,JSON.stringify(v))}catch(e){}}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function touch(){ACTIVE[today()]=1}
function streak(){let n=0;const d=new Date();if(!ACTIVE[ymd(d)])d.setDate(d.getDate()-1);while(ACTIVE[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function msToday(){let ms=(DAYS[today()]||{}).ms||0;if(SESS){const m=new Date();m.setHours(0,0,0,0);ms+=Date.now()-Math.max(SESS.start,m.getTime())}return ms}

function startSess(){SESS={start:Date.now(),ping:Date.now()};touch();save();lockOn();chime(true)}
function stopSess(){if(!SESS)return;const m=new Date();m.setHours(0,0,0,0);const d=day(today());d.ms+=Date.now()-Math.max(SESS.start,m.getTime());
  LOG.push({date:today(),time:hm(new Date(SESS.start)),kind:'sess',ms:Date.now()-SESS.start});SESS=null;save();lockOff()}
function quick(k){const d=day(today());d.quick[k]=(d.quick[k]||0)+1;LOG.push({date:today(),time:hm(new Date()),kind:'quick',want:k});if(SESS)SESS.ping=Date.now();touch();save();chime(true)}

let AC=null;function chime(soft){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=soft?528:660;
  g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(soft?.04:.12,AC.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1.6);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+1.7)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(soft?25:[60,80,60])}catch(e){}}
let WL=null;async function lockOn(){try{WL=await navigator.wakeLock.request('screen')}catch(e){}}function lockOff(){try{WL&&WL.release()}catch(e){}WL=null}

/* ---------- motion helpers (skipped when the viewer prefers reduced motion) ---------- */
const CALM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function center(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2,r.width,r.height]}
function wave(el,n,scale){if(CALM||!el)return;const [x,y,w]=center(el);for(let i=0;i<(n||2);i++){const s=document.createElement('span');s.className='wave';
  s.style.cssText=`left:${x}px;top:${y}px;width:${w*(scale||1)}px;height:${w*(scale||1)}px;animation-delay:${i*.18}s`;document.body.appendChild(s);s.addEventListener('animationend',()=>s.remove())}}
function motes(el,n){if(CALM||!el)return;const [x,y,w,h]=center(el);for(let i=0;i<(n||8);i++){const s=document.createElement('span');s.className='mote';
  const dx=(Math.random()-.5)*w*.9;s.style.cssText=`left:${x+dx}px;top:${y+(Math.random()-.3)*h*.4}px;--x:${(Math.random()-.5)*60}px;--y:${90+Math.random()*120}px;--d:${1.2+Math.random()*1.2}s;width:${4+Math.random()*5}px;height:${4+Math.random()*5}px`;
  document.body.appendChild(s);s.addEventListener('animationend',()=>s.remove())}}
function plus(el,txt){if(CALM||!el)return;const r=el.getBoundingClientRect(),s=document.createElement('span');s.className='plus';s.textContent=txt||'+1';
  s.style.cssText=`left:${r.right-28}px;top:${r.top+6}px`;document.body.appendChild(s);s.addEventListener('animationend',()=>s.remove())}
function bump(el){if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function countTo(el,from,to){if(!el)return;if(CALM||from===to){el.textContent=to;return}let v=from;const st=from>to?-1:1;el.textContent=v;
  const t=setInterval(()=>{v+=st;el.textContent=v;if(v===to)clearInterval(t)},Math.max(70,600/Math.abs(to-from)))}

function openFlow(pre){F=Object.assign(newF(),pre||{});if(F.sel.length){F.lvl=F.sel[0].l}
  $('#layer').innerHTML=`<div class="fx" id="fx" role="dialog" aria-label="释放一件事"><div class="fx-top"><button class="iconbtn" id="x" aria-label="关闭">${icon('close')}</button><div class="segs" id="segs"></div><span class="cap" id="stepname" style="width:2.6em;text-align:right"></span></div>
    <div class="fx-body" id="fxbody"></div><div class="fx-foot" id="fxfoot"></div></div>`;
  $('#x').onclick=closeFlow;paintF()}
function closeFlow(){const fx=$('#fx');F=null;if(fx&&!CALM){fx.classList.add('out');setTimeout(()=>{$('#layer').innerHTML='';render()},260)}else{$('#layer').innerHTML='';render()}}
const curName=()=>F.cur==='change'?CHANGE:WANTS[F.cur];
const selWords=()=>F.sel.length?F.sel.map(s=>s.w).join('、'):(F.word||'');
const selLevels=()=>[...new Set(F.sel.map(s=>s.l))];
function hintFor(i){const ws=F.sel.filter(s=>HINT[s.l].includes(i)).map(s=>s.w);return ws.length?`常见于${ws.slice(0,2).join('、')}${ws.length>2?'等':''}`:''}
function trayHTML(){return F.sel.length?`${esc(selWords())} <em>· ${F.sel.length} 个</em>`:'<em>点选一个或几个词</em>'}
function paintF(){
  const st=Math.min(F.step,4);let h='',b='',f='';
  if(F.step===1){h=F.mode==='goal'?'想到这件事，升起了什么感受？':'此刻，你感受到了什么？';
    b=`<div class="chips"><button class="chip ${F.mode==='feel'?'on':''}" data-mode="feel">感受</button><button class="chip" data-mode="stuck">卡住了，说不清</button><button class="chip ${F.mode==='goal'?'on':''}" data-mode="goal">一件想要的事</button></div>
    <input type="text" id="topic" value="${esc(F.topic)}" placeholder="${F.mode==='goal'?'想要的是什么？':'关于什么事？可以不填'}" aria-label="关于什么事">
    <div class="meter"><div class="split"><span class="meta">整体有多强</span><b class="mnum" id="bv">${F.before}</b></div><input type="range" id="before" min="0" max="10" value="${F.before}" aria-label="强度"><div class="split cap"><span>0 很轻</span><span>10 非常强</span></div></div>
    <input type="search" id="find" placeholder="找一个词：委屈、烦躁、焦虑……" aria-label="找一个词">
    <p class="cap">可以多选。常常不止一种感受，把此刻有的都点上。</p>
    <div class="emo" id="emo">${FEEL.map((x,i)=>`<div class="lv" data-l="${i}"><b>${x.k}<small>${x.en}</small></b><div class="words">${EMO[i].map(w=>`<button class="${F.sel.some(s=>s.w===w)?'sel':''}" data-pick="${i}" data-word="${w}" aria-pressed="${F.sel.some(s=>s.w===w)}">${w}</button>`).join('')}</div></div>`).join('')}</div>`;
    f=`<span class="tray" id="tray">${trayHTML()}</span><button class="btn solid" id="next1" ${F.sel.length?'':'disabled'}>下一步</button>`}
  if(F.step===2){h='它们底下想要的是什么？';
    b=`<p class="meta">看着${F.sel.length>1?'这些感受':'这份感受'}「${esc(selWords()||FEEL[F.lvl].k)}」，读下面的问题，哪一组让你心里一动。</p>
    ${WANTS.map((w,i)=>{const hn=F.sel.length?hintFor(i):(F.lvl!=null&&HINT[F.lvl].includes(i)?FEEL[F.lvl].k+'常见':'');return `<button class="wcard" data-want="${i}"><span class="h"><b>${w}</b>${hn?`<span class="badge">${esc(hn)}</span>`:''}</span><ul>${WANTP[i].ask.map(a=>`<li>${a}</li>`).join('')}</ul><span class="say">${WANTP[i].say.map(t=>`<span>“${t}”</span>`).join('')}</span></button>`}).join('')}
    <button class="wcard" data-want="change"><span class="h"><b>看不清</b></span><span style="font-size:14px">那就释放“想要改变这个感受”</span></button>`;
    f=`<button class="btn" data-step="1">上一步</button><span class="cap">点一项就会继续</span>`}
  if(F.step===3){h=F.cur==='change'?'释放想要改变它':'允许它浮现，然后放下';
    const sz=Math.max(64,220-F.rounds*28),op=Math.max(.32,1-F.rounds*.09);
    const word=F.rounds===0?(F.cur==='change'?'不管它是什么，<br>让“想要改变它”的那股劲离开。':`感受这份${curName()}。<br>允许它完全浮现上来，<br>然后让它离开。`):(F.rounds<3?'还有剩下的吗？<br>有的话，再放一次。':'像波浪一样，浮现，离开，<br>直到波浪停止。');
    const deep=!F.deep&&F.rounds>=3&&(F.wants['想要被认同']||F.wants['想要控制'])&&F.cur!==2;
    b=`${F.sel.length?`<div class="fading" id="fading" style="--fo:${Math.max(.2,1-F.rounds*.16)};--fb:${Math.min(3,F.rounds*.5)}px">${F.sel.map(s=>`<span>${esc(s.w)}</span>`).join('')}</div>`:''}
      <div class="stage"><div class="ball" id="ball" style="--s:${sz}px;--o:${op}"><span class="orb breathe"></span></div><p class="say-big" id="words">${word}</p>
      <p class="cap" id="tally">${Object.entries(F.wants).map(([k,n])=>k+' ×'+n).join(' · ')||'还没放下'}</p>
      <div class="row" style="justify-content:center"><button class="btn sm" id="other">底下还有别的想要</button><button class="btn sm" id="stuck">卡住了</button></div></div>
      ${deep?`<div class="note pop-in"><p>当你释放了那些，在它们底端的“对死亡的恐惧”，就会自然地、明显可察觉地浮现出来，给你去释放。</p><p class="cap" style="margin:4px 0 10px">The Way《Lesson 1》</p><button class="btn sm" id="deep">往下看一层：想要安全</button></div>`:''}`;
    f=`<button class="btn solid" id="let" style="flex:1">放下了</button><button class="btn" id="tocheck" ${F.rounds?'':'disabled'}>轻了</button>`}
  if(F.step===4){h='还剩几分？';if(F.after==null)F.after=Math.max(0,F.before-3);
    b=`<div class="meter"><div class="split"><span class="meta">之前是 ${F.before}</span><b class="mnum" id="av">${F.after}</b></div><input type="range" id="after" min="0" max="10" value="${F.after}" aria-label="现在的强度"><div class="split cap"><span>0 干净了</span><span>10</span></div></div>
    <div class="note" id="clean" ${F.after>0?'':'hidden'}><p>还剩一点，说明想要还在。想要的感觉就是“没有”，留着它就会一直想要。</p><p class="cap" style="margin:4px 0 10px">“你们有没有特别注意去持续释放欲望，放走更多、放走更多、放走更多，直到没有更多？” The Right Path 开篇</p><button class="btn sm acc" id="more">继续放到 0</button></div>
    <p class="meta">现在最接近哪一种？（可不选）</p>
    <div class="levels">${[...CAP.slice().reverse().map(x=>[x.k,1]),...FEEL.slice().reverse().map(x=>[x.k,0])].map(([k,c])=>`<button class="${c?'cap-l':''} ${F.state===k?'on':''}" data-state="${k}">${k}</button>`).join('')}</div>`;
    f=`<button class="btn" id="back3">再放一轮</button><button class="btn solid" id="save">完成</button>`}
  if(F.step===5){const s=F.saved,d=s.before-s.after;h=d>0?`轻了 ${d} 分`:'记下来了';
    b=`<div class="stage"><div class="ball settle" id="ball" style="--s:${Math.max(56,130-d*9)}px"><span class="orb"></span></div><p class="done-num"><span id="from">${s.before}</span> → <span id="to">${s.before}</span></p>
      <p class="meta" style="text-align:center">${esc(s.word||'')}${s.topic?' · '+esc(s.topic):''}${s.state?' → '+esc(s.state):''}</p><p class="cap" style="text-align:center">放下了 ${s.rounds} 次：${Object.entries(s.wants).map(([k,n])=>k+' ×'+n).join('、')}</p></div>
      <div class="note">“从现在开始，任何你想要的东西，都通过释放来得到它。” <span class="cap">The Way《Lesson 1》</span></div>`;
    f=`<button class="btn" id="again">再释放一件事</button><button class="btn solid" id="close2">回到主页</button>`}
  $('#segs').innerHTML=[1,2,3,4].map(k=>`<i class="${k<=st||F.step===5?'on':''}"></i>`).join('');
  $('#stepname').textContent=['','看见','辨认','放下','回看','完成'][F.step];
  const body=$('#fxbody');body.innerHTML=`<div class="fx-in ${F.dir>0?'fwd':'back'}"><h1>${h}</h1>${b}</div>`;body.scrollTop=0;
  $('#fxfoot').innerHTML=f;bindF();
  if(F.step===5){setTimeout(()=>{countTo($('#to'),F.saved.before,F.saved.after);wave($('#ball'),3,1.4)},250)}}
function go(s){F.dir=s>=F.step?1:-1;F.step=s;paintF()}
function bindF(){const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  on('#close2',closeFlow);on('#again',()=>openFlow());
  $$('[data-mode]').forEach(b=>b.onclick=()=>{const m=b.dataset.mode;if(m==='stuck'){F.mode='stuck';F.cur='change';F.word='卡住';F.sel=[];go(3)}else{F.mode=m;$$('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));$('#topic').placeholder=m==='goal'?'想要的是什么？':'关于什么事？可以不填';$('.fx-in h1').textContent=m==='goal'?'想到这件事，升起了什么感受？':'此刻，你感受到了什么？'}});
  const t=$('#topic');if(t)t.oninput=()=>F.topic=t.value;
  const bf=$('#before');if(bf)bf.oninput=()=>{F.before=+bf.value;$('#bv').textContent=bf.value;bump($('#bv'))};
  const fd=$('#find');if(fd)fd.oninput=()=>{const q=fd.value.trim();$$('#emo .lv').forEach(l=>{let any=false;l.querySelectorAll('[data-word]').forEach(b=>{const m=q&&b.dataset.word.includes(q);b.classList.toggle('hit',!!m);any=any||m});l.classList.toggle('dim',!!q&&!any)})};
  $$('[data-pick]').forEach(b=>b.onclick=()=>{const w=b.dataset.word,l=+b.dataset.pick,i=F.sel.findIndex(s=>s.w===w);
    if(i>=0)F.sel.splice(i,1);else F.sel.push({w,l});const on2=i<0;b.classList.toggle('sel',on2);b.setAttribute('aria-pressed',on2);
    F.lvl=F.sel.length?F.sel[0].l:null;$('#tray').innerHTML=trayHTML();bump($('#tray'));$('#next1').disabled=!F.sel.length;try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}});
  on('#next1',()=>{if(F.sel.length)go(2)});
  $$('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));
  $$('[data-want]').forEach(b=>b.onclick=()=>{F.cur=b.dataset.want==='change'?'change':+b.dataset.want;go(3)});
  on('#let',()=>{F.rounds++;const k=curName();F.wants[k]=(F.wants[k]||0)+1;touch();save();chime(true);
    const o=$('#ball');wave(o,2,1);motes(o,10);
    if(F.rounds===3&&!F.deep&&(F.wants['想要被认同']||F.wants['想要控制'])){setTimeout(()=>{F.dir=0;paintF()},450);return}
    o.style.setProperty('--s',Math.max(64,220-F.rounds*28)+'px');o.style.setProperty('--o',Math.max(.32,1-F.rounds*.09));
    const fa=$('#fading');if(fa){fa.style.setProperty('--fo',Math.max(.2,1-F.rounds*.16));fa.style.setProperty('--fb',Math.min(3,F.rounds*.5)+'px')}
    const wd=$('#words');wd.classList.remove('fadeswap');void wd.offsetWidth;wd.classList.add('fadeswap');
    wd.innerHTML=F.rounds<3?'还有剩下的吗？<br>有的话，再放一次。':'像波浪一样，浮现，离开，<br>直到波浪停止。';
    $('#tally').textContent=Object.entries(F.wants).map(([k,n])=>k+' ×'+n).join(' · ');$('#tocheck').disabled=false});
  on('#other',()=>{if(F.lvl==null)F.lvl=2;go(2)});on('#stuck',()=>{F.cur='change';F.dir=0;paintF()});on('#deep',()=>{F.deep=true;F.cur=2;F.dir=1;paintF()});
  on('#tocheck',()=>go(4));
  const af=$('#after');if(af)af.oninput=()=>{F.after=+af.value;$('#av').textContent=af.value;bump($('#av'));$('#clean').hidden=!(F.after>0)};
  on('#more',()=>{if(F.orig==null)F.orig=F.before;F.before=F.after;F.after=null;go(F.cur==='change'||F.lvl==null?3:2)});
  on('#back3',()=>{F.after=null;go(3)});
  $$('[data-state]').forEach(b=>b.onclick=()=>{F.state=F.state===b.dataset.state?null:b.dataset.state;$$('[data-state]').forEach(x=>x.classList.toggle('on',x.dataset.state===F.state))});
  on('#save',()=>{const rec={date:today(),time:hm(new Date()),kind:'flow',mode:F.mode,topic:F.topic,word:selWords()||(F.lvl!=null?FEEL[F.lvl].k:''),words:F.sel.map(s=>s.w),
      level:selLevels().map(l=>FEEL[l].k).join('、')||(F.lvl!=null?FEEL[F.lvl].k:''),before:F.orig??F.before,after:F.after,state:F.state,rounds:F.rounds,wants:F.wants};
    LOG.push(rec);touch();save();F.saved=rec;go(5)});
}

/* ---------- check-in banner ---------- */
function ping(){chime(false);const old=$('#ping');if(old)old.remove();const p=document.createElement('div');p.id='ping';p.className='ping';p.setAttribute('role','alert');
  p.innerHTML=`<div class="split"><b class="serif">此刻，有想要吗？</b><button class="cap" id="pno">没有，平静</button></div><div class="pq">${QUICK.map(x=>`<button data-pq="${x.k}">${x.k.replace('想要','')}</button>`).join('')}</div>`;
  document.body.appendChild(p);
  const bye=()=>{p.classList.add('bye');setTimeout(()=>p.remove(),260)};
  p.querySelectorAll('[data-pq]').forEach(b=>b.onclick=()=>{quick(b.dataset.pq);wave(b,1,1);bye();if(!F)render(true)});
  $('#pno').onclick=bye;setTimeout(bye,60000)}
setInterval(()=>{if(!SESS)return;const now=Date.now();
  const c=$('#clock');if(c){c.textContent=clock(now-SESS.start);const ms=msToday();$('#todayms').textContent=fmt(ms);$('#gbar').style.width=Math.min(100,ms/(CFG.goal*36e5)*100)+'%';$('#awake').textContent=`清醒时间的 ${Math.round(ms/(CFG.awake*36e5)*100)}%`}
  if(CFG.every&&now-SESS.ping>=CFG.every*60000){SESS.ping=now;save();ping()}},1000);

/* ---------- render ---------- */
function render(anim){
  const m=$('#main');m.innerHTML=V[TAB]();m.classList.remove('tabin');if(anim===true&&!CALM){void m.offsetWidth;m.classList.add('tabin')}
  $('#tabs').innerHTML=TABS.map(([k,t,i])=>`<button data-tab="${k}" class="${TAB===k?'on':''}">${icon(i)}<span>${t}</span></button>`).join('');
  $$('[data-tab]').forEach(b=>b.onclick=()=>{if(TAB===b.dataset.tab)return;TAB=b.dataset.tab;render(true);scrollTo(0,0)});
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  on('#start',()=>{startSess();render();wave($('.today'),1,.5)});on('#stop',()=>{stopSess();render()});on('#open',()=>{wave($('#open'),2,1);setTimeout(()=>openFlow(),CALM?0:160)});
  $$('[data-q]').forEach(b=>b.onclick=()=>{quick(b.dataset.q);b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),350);const n=b.querySelector('[data-n]');n.textContent=quickToday()[b.dataset.q];bump(n);plus(b);wave(b,1,.7);motes($('#open'),5);
    const t=$('.top .meta');if(t)t.textContent=t.textContent.replace(/今天释放 \d+ 次/,`今天释放 ${nToday()} 次`)});
  let qi=0;on('#nextq',()=>{if(!QUOTES.length)return;qi=(qi+1+Math.floor(Math.random()*QUOTES.length))%QUOTES.length;const q=QUOTES[qi];$('#nextq').innerHTML=`<p class="quote">${esc(q.q)}</p><span class="cap">${qsrc(q)} · 点一下换一句</span>`});
  $$('[data-go]').forEach(b=>b.onclick=()=>openFlow({sel:[{w:b.dataset.w,l:+b.dataset.go}]}));
  $$('[data-every]').forEach(b=>b.onclick=()=>{CFG.every=+b.dataset.every;save();render()});
  $$('[data-goal]').forEach(b=>b.onclick=()=>{CFG.goal=+b.dataset.goal;save();render()});
  $$('[data-awake]').forEach(b=>b.onclick=()=>{CFG.awake=+b.dataset.awake;save();render()});
  on('#copy',()=>{const txt=JSON.stringify({LOG,DAYS},null,1),m=$('#msg');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>m.textContent='已复制').catch(()=>{m.textContent='无法自动复制，请手动复制下方内容';const t=document.createElement('textarea');t.value=txt;m.after(t);t.select()})});
}
render(true);
if(SESS)lockOn();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
})();
</script>
