<title>释放随身</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap">
<style>
/* Layout: iOS grouped style. Surfaces are separated by fill and space, never by lines.
   Glass (blur + translucency) on the floating bars and sheets only; the orb is the one bold visual. */
:root{
  --bg:#f2f2f7; --bg-2:#e9eef0; --cell:rgba(255,255,255,.86); --cell-solid:#ffffff; --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.08);
  --label:#111214; --label-2:rgba(60,60,67,.72); --label-3:rgba(60,60,67,.5);
  --tint:#1f8a63; --tint-ink:#ffffff; --tint-fill:rgba(31,138,99,.12); --tile:rgba(31,138,99,.10); --tile-ink:#145c42;
  --orb-1:#d6f3e7; --orb-2:#5fbf9b; --orb-3:#17795a; --flame:#ff7a1a;
  --glass:rgba(249,249,251,.72); --glass-hi:rgba(255,255,255,.65); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 14px rgba(0,0,0,.05); --scrim:rgba(0,0,0,.25);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --spring:cubic-bezier(.32,1.25,.5,1); --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --bg-2:#06100c; --cell:rgba(28,28,30,.86); --cell-solid:#1c1c1e; --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.16);
  --label:#f5f5f7; --label-2:rgba(235,235,245,.66); --label-3:rgba(235,235,245,.42);
  --tint:#3ecf8e; --tint-ink:#03140d; --tint-fill:rgba(62,207,142,.16); --tile:rgba(62,207,142,.12); --tile-ink:#9ff0c9;
  --orb-1:#1e4a3b; --orb-2:#2f9e78; --orb-3:#a6f2d3;
  --glass:rgba(22,22,24,.68); --glass-hi:rgba(255,255,255,.08); --shadow:0 1px 2px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --bg-2:#06100c; --cell:rgba(28,28,30,.86); --cell-solid:#1c1c1e; --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.16);
  --label:#f5f5f7; --label-2:rgba(235,235,245,.66); --label-3:rgba(235,235,245,.42);
  --tint:#3ecf8e; --tint-ink:#03140d; --tint-fill:rgba(62,207,142,.16); --tile:rgba(62,207,142,.12); --tile-ink:#9ff0c9;
  --orb-1:#1e4a3b; --orb-2:#2f9e78; --orb-3:#a6f2d3;
  --glass:rgba(22,22,24,.68); --glass-hi:rgba(255,255,255,.08); --shadow:0 1px 2px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--label)}
body{margin:0;font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background:linear-gradient(180deg,var(--bg-2) 0,var(--bg) 360px) no-repeat,var(--bg);transition:background-color .4s}
input,textarea{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:3px;border-radius:12px}
h1,h2,h3,p{margin:0}
h1{font-size:32px;font-weight:800;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:20px;font-weight:700;line-height:1.35;text-wrap:balance}
.serif{font-family:var(--serif)}
.meta{font-size:15px;color:var(--label-2)}
.cap{font-size:13px;color:var(--label-3);line-height:1.55}
main{max-width:560px;margin:0 auto;padding-block:18px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* press feedback: everything tappable shrinks and dims a touch, springs back */
.tap{transition:transform .35s var(--spring),opacity .2s,background-color .25s,color .25s}
.tap.down{transform:scale(.96);opacity:.75;transition:transform .1s ease,opacity .1s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-size:16px;font-weight:600;background:var(--fill);color:var(--label)}
.btn.solid{background:var(--label);color:var(--bg)}
.btn.acc{background:var(--tint);color:var(--tint-ink)}
.btn.sm{min-height:36px;padding:0 15px;font-size:14px}
.btn:disabled{opacity:.3}
.card{background:var(--cell);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--tint);transition:width .8s var(--ease)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--label-2);background:var(--fill-2);flex:none}
.iconbtn svg{width:20px;height:20px}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .r{display:flex;align-items:center;gap:8px}
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;color:var(--label-2)}
.streak svg{width:16px;height:16px;color:var(--flame)}
.today{background:var(--tile);color:var(--tile-ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px}
.today .big{font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.today .bar{background:color-mix(in srgb,var(--tile-ink) 14%,transparent)}
.today .bar i{background:var(--tile-ink)}
.today .k{font-size:13.5px;font-weight:600;opacity:.8}
.live{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700}
.live i{width:8px;height:8px;border-radius:50%;background:var(--tile-ink)}
.today .btn{background:var(--tile-ink);color:var(--bg)}
.today .btn.ghost{background:color-mix(in srgb,var(--tile-ink) 12%,transparent);color:var(--tile-ink)}
.orbbox{display:grid;place-items:center;padding:4px 0}
.orbbtn{width:min(52vw,200px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center}
.orb{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9),rgba(255,255,255,0) 40%),radial-gradient(circle at 50% 62%,var(--orb-2),var(--orb-3) 74%);
  box-shadow:inset 0 -14px 28px rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.45),0 14px 18px rgba(23,121,90,.16)}
.orbbtn .lbl{position:relative;font-weight:700;font-size:20px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2);text-align:center;line-height:1.4}
.orbbtn .lbl small{display:block;font-size:12.5px;font-weight:500;opacity:.92}
.breathe{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.95)}50%{transform:scale(1.03)}}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.q{background:var(--cell);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);position:relative;min-height:86px}
.q b{font-size:17px;font-weight:700}
.q small{font-size:12.5px;color:var(--label-2);line-height:1.5}
.q .n{position:absolute;right:14px;top:12px;font-weight:800;font-size:22px;color:var(--tint);font-variant-numeric:tabular-nums;display:inline-block}
.q.pop{background:var(--tint-fill)}
.quote{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.8}
.sect{display:flex;flex-direction:column;gap:12px}
.sect>h2{padding-left:4px}

/* tab bar: floating glass capsule */
.dock{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none}
.tabs{pointer-events:auto;position:relative;display:flex;padding:5px;border-radius:999px;width:100%;max-width:400px;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 20px rgba(0,0,0,.08)}
.tabs .pill{position:absolute;top:5px;bottom:5px;left:5px;border-radius:999px;background:var(--cell-solid);box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .45s var(--spring),width .45s var(--spring)}
.tabs button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--label-3);transition:color .3s}
.tabs svg{width:22px;height:22px}
.tabs .on{color:var(--tint)}

/* full-screen guided release */
.fx{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:up .42s var(--ease) both}
.fx.out{animation:downout .28s ease forwards}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes downout{to{transform:translateY(40px);opacity:0}}
.fx-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.fx-top .segs{flex:1}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.segs i{height:4px;border-radius:2px;background:var(--fill);transition:background .5s}
.segs i.on{background:var(--tint)}
.fx-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.fx-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.fx-in.fwd{animation:swapf .38s var(--ease) both}.fx-in.back{animation:swapb .38s var(--ease) both}
@keyframes swapf{from{opacity:0;transform:translateX(26px)}}@keyframes swapb{from{opacity:0;transform:translateX(-26px)}}
.fx-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:999px;background:var(--fill);font-size:14.5px;font-weight:600}
.chip.on{background:var(--label);color:var(--bg)}
input[type=text],input[type=search],textarea{width:100%;font:inherit;font-size:17px;color:var(--label);background:var(--fill);border:0;border-radius:14px;padding:12px 16px}
input[type=search]{border-radius:999px;padding-left:20px}
textarea{min-height:90px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--label-3)}
.meter{background:var(--cell);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.meter input[type=range]{width:100%;accent-color:var(--tint);height:30px}
.mnum{font-weight:800;font-size:30px;line-height:1;color:var(--tint);font-variant-numeric:tabular-nums;display:inline-block}
.emo{display:flex;flex-direction:column;gap:16px}
.lv{display:grid;grid-template-columns:4.4em minmax(0,1fr);gap:8px;align-items:start;transition:opacity .3s}
.lv>b{padding-top:6px;font-size:15px;font-weight:700}
.lv>b small{display:block;font-weight:500;font-size:11.5px;color:var(--label-3)}
.lv.dim{opacity:.28}
.words{display:flex;flex-wrap:wrap;gap:7px}
.words button{padding:7px 13px;border-radius:999px;background:var(--cell);box-shadow:var(--shadow);font-size:14.5px;transition:transform .35s var(--spring),background .2s,color .2s}
.words button.hit{background:var(--tint-fill);color:var(--tint);font-weight:700;box-shadow:none}
.words button.sel{background:var(--tint);color:var(--tint-ink);box-shadow:none;transform:scale(1.06)}
.wcard{width:100%;background:var(--cell);border-radius:22px;padding:17px 18px;text-align:left;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.wcard .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wcard .h b{font-size:18px;font-weight:700}
.wcard ul{margin:0;padding-left:1.1em;font-size:14.5px;line-height:1.65;color:var(--label-2)}
.say{display:flex;flex-wrap:wrap;gap:6px}
.say span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--fill-2);color:var(--label-2)}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tint-fill);color:var(--tint);flex:none}
.stage{display:flex;flex-direction:column;align-items:center;gap:20px;padding:8px 0}
.ball{width:var(--s,220px);height:var(--s,220px);position:relative;opacity:var(--o,1);transition:width 1.1s var(--spring),height 1.1s var(--spring),opacity 1.1s}
.say-big{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.8;text-align:center}
.note{border-radius:20px;padding:14px 16px;background:var(--tint-fill);font-size:14.5px;line-height:1.7}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.levels button{padding:11px 4px;border-radius:14px;background:var(--fill);font-weight:700;font-size:15px}
.levels button.cap-l{color:var(--tint)}
.levels button.on{background:var(--label);color:var(--bg)}
.done-num{font-weight:800;font-size:60px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tray{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:700;display:inline-block}
.tray em{font-style:normal;font-weight:500;color:var(--label-3)}
.fading{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;opacity:var(--fo,1);filter:blur(var(--fb,0px));transition:opacity 1.2s ease,filter 1.2s ease}
.fading span{padding:5px 12px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600}

/* check-in banner (iOS notification style) */
.ping{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;width:min(540px,calc(100% - 20px));border-radius:24px;padding:14px;
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:10px;animation:down .5s var(--spring) both}
@keyframes down{from{transform:translate(-50%,-30px);opacity:0}}
.ping.bye{animation:pingout .25s ease forwards}
@keyframes pingout{to{transform:translate(-50%,-20px);opacity:0}}
.ping .pq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ping .pq button{padding:10px 2px;border-radius:14px;background:var(--fill);font-size:13.5px;font-weight:700}

/* records + settings: inset grouped, no separators */
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.figs div{display:flex;flex-direction:column;background:var(--cell);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.figs b{font-size:26px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.figs span{font-size:12.5px;color:var(--label-2)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:130px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;border-radius:8px;background:var(--tint);min-height:4px;transform-origin:bottom;animation:grow .7s var(--spring) both}
@keyframes grow{from{transform:scaleY(0)}}
.week span{font-size:11.5px;color:var(--label-3);font-variant-numeric:tabular-nums}
.list{background:var(--cell);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);padding:4px 0}
.list>*{display:flex;gap:12px;align-items:center;padding:11px 16px}
.list .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list small{font-size:12.5px;color:var(--label-2)}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--label-3);flex:none;width:3em}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--fill);color:var(--label-2);font-weight:600}
.tag.a{background:var(--tint-fill);color:var(--tint)}
/* iOS segmented control */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:10px;background:var(--fill)}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:8px;background:var(--cell-solid);box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .45s var(--spring)}
.seg button{position:relative;z-index:1;padding:7px 4px;font-size:13.5px;font-weight:600;border-radius:8px}
.seg button.on{font-weight:700}
/* iOS switch */
.switch{position:relative;width:51px;height:31px;border-radius:999px;background:var(--fill);flex:none;transition:background .3s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .4s var(--spring)}
.switch.on{background:#34c759}
.switch.on::after{transform:translateX(20px)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ref{display:flex;flex-direction:column;gap:12px}
.hapt{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}

/* motion */
.wave{position:fixed;border-radius:50%;pointer-events:none;z-index:45;box-shadow:inset 0 0 0 2px var(--orb-2);transform:translate(-50%,-50%) scale(.7);opacity:.9;animation:ripple 1.4s var(--ease) forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(2.1);opacity:0}}
.mote{position:fixed;border-radius:50%;background:var(--orb-2);pointer-events:none;z-index:45;animation:mote var(--d,1.6s) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes mote{from{transform:translate(-50%,-50%);opacity:.85}to{transform:translate(calc(-50% + var(--x)),calc(-50% - var(--y))) scale(.3);opacity:0}}
.plus{position:fixed;z-index:45;font-weight:800;font-size:18px;color:var(--tint);pointer-events:none;animation:plus .9s var(--ease) forwards}
@keyframes plus{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-38px);opacity:0}}
.bump{animation:bump .45s var(--spring)}
@keyframes bump{40%{transform:scale(1.35)}}
.fadeswap{animation:fadeswap .5s ease}
@keyframes fadeswap{from{opacity:0;transform:translateY(6px)}}
.pop-in{animation:popin .5s var(--spring) both}
@keyframes popin{from{opacity:0;transform:scale(.94)}}
.settle .orb{animation:settle 1.2s var(--spring)}
@keyframes settle{0%{transform:scale(1.25)}100%{transform:scale(1)}}
main.tabin>*{animation:tabin .45s var(--ease) both}main.tabin>*:nth-child(2){animation-delay:.04s}main.tabin>*:nth-child(3){animation-delay:.08s}main.tabin>*:nth-child(n+4){animation-delay:.12s}
@keyframes tabin{from{opacity:0;transform:translateY(12px)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .orbbtn .lbl{color:#03140d;text-shadow:none}}
:root[data-theme="dark"] .orbbtn .lbl{color:#03140d;text-shadow:none}

/* 3D orb */
.orb3d{position:absolute;inset:0;display:block}
.orbgl{position:absolute;inset:-6%;width:112%;height:112%;display:block}
.orbbtn{transition:none}
.orbbtn.tap.down{transform:none;opacity:1}
.ball{width:240px;height:240px;transition:none;opacity:1}
/* ===== glass layer: a soft living wallpaper behind, frosted translucent surfaces in front ===== */
:root{--g:rgba(255,255,255,.42);--g-2:rgba(255,255,255,.34);--g-strong:rgba(250,252,251,.62);--edge:rgba(255,255,255,.75);--edge-2:rgba(255,255,255,.35);
  --gshadow:0 1px 1px rgba(0,0,0,.03),0 8px 16px rgba(20,60,45,.07);--blur:blur(24px) saturate(185%);
  --w0:#eef1ef;--w1:#b7d9c8;--w2:#c6d6df;--w3:#dde6da;--w4:#c4e0d6}

<script>
(function(){
const QUOTES=/*QUOTES*/[];
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('rel:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('rel:'+k,JSON.stringify(v))}catch(e){}}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const fmt=ms=>{const m=Math.floor(ms/60000),h=Math.floor(m/60);return h?`${h} 小时 ${m%60} 分`:`${m} 分钟`};
const clock=ms=>{const t=Math.max(0,Math.floor(ms/1000));return [Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(x=>String(x).padStart(2,'0')).join(':')};

/* ---------- content ---------- */
const FEEL=[{k:'万念俱灰',en:'Apathy'},{k:'悲苦',en:'Grief'},{k:'恐惧',en:'Fear'},{k:'贪求',en:'Lust'},{k:'愤怒',en:'Anger'},{k:'自尊自傲',en:'Pride'}];
const CAP=[{k:'无畏',en:'Courageousness'},{k:'接纳',en:'Acceptance'},{k:'平和',en:'Peace'}];
// 情绪词：参考 1992 年圣多纳课程的情绪表整理（不是《莱斯特合集》原文）
const EMO=[
  ['无聊','麻木','绝望','无力','没用','放弃','疲惫','冷漠','心灰意冷','提不起劲','无所谓','被困住','迷失','拖延','懒得动'],
  ['委屈','伤心','失落','孤独','心痛','被抛弃','遗憾','后悔','无助','自怜','想哭','被误解','思念','愧疚','受伤'],
  ['焦虑','担心','紧张','害怕','不安','慌张','恐慌','怀疑','尴尬','害羞','警惕','怕出错','怕失去','怯场','多疑'],
  ['渴望','贪心','急切','执着','上瘾','迫不及待','嫉妒','非要不可','想占有','羡慕','不满足','强求','索取','计较','馋'],
  ['烦躁','生气','恼火','怨恨','不耐烦','嫌弃','愤慨','讨厌','叛逆','挑剔','暴躁','不服','敌意','抓狂','想反击'],
  ['优越','看不起','评判','固执','自以为是','要面子','不屑','清高','自满','傲慢','不肯认错','炫耀','虚荣','爱比较','觉得自己对']];
const CAPW=[['自信','有干劲','清晰','乐于行动','有创造力'],['温暖','感恩','包容','喜悦','平衡'],['宁静','完整','轻盈','自在','合一']];
const WANTS=['想要被认同','想要控制','想要安全'];
const CHANGE='想要改变它';
const WANTP=[
  {ask:['我想让别人喜欢我、认可我吗？','我在意他会怎么看我吗？','我想被爱、被照顾、被理解吗？','我觉得自己不够好吗？'],say:['他们会怎么看我','我做得够好吗','为什么没人懂我','我得证明自己','他不在乎我']},
  {ask:['我想改变这件事或这个人吗？','我想让事情按我的方式来吗？','我想弄明白、想要一个答案吗？','我在抗拒正在发生的事吗？'],say:['应该 / 不应该','必须','怎么还不……','我得想办法','凭什么']},
  {ask:['我担心会失去什么吗？','我怕受伤、怕出事吗？','我觉得没有它就活不下去吗？','我在为将来担心吗？'],say:['万一……怎么办','我会失去……','我撑不住了','不安全','来不及了']}];
const HINT=[[2],[0,2],[2],[1,0],[1],[0,1]]; // 每层感受常见的想要（参考，不是规则）
const QUICK=[{k:'想要被认同',s:'“他会怎么看我”'},{k:'想要控制',s:'“应该 / 必须”'},{k:'想要安全',s:'“万一……怎么办”'},{k:CHANGE,s:'卡住、说不清、累'}];
const RAMP=[[1,'一天一小时'],[2,'早晚各一小时'],[4,'几个小时'],[8,'半天'],[16,'一整天']];
const ICON={
  orb:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
  eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  check:'<path d="M5 12.5 10 17l9-10"/>',
  flame:'<path d="M12 21c-3.9 0-6.5-2.6-6.5-6.1 0-3.2 2.3-5 3.6-7.4.4 1.7 1.3 2.7 2.4 3.2C11.3 7.6 12.6 4.6 15 3c-.2 3 2.2 4.8 3.2 7 .9 1.9 1.3 3.2 1.3 4.8C19.5 18.4 16 21 12 21z"/>'};
const icon=(k,f)=>`<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${ICON[k]}</svg>`;
const qsrc=q=>`${esc(q.c)}《${esc(q.t)}》，第 ${q.p} 页`;

/* ---------- state ---------- */
let CFG=Object.assign({every:10,goal:2,awake:16,theme:'auto',haptic:true},store.get('cfg',{}));
let SESS=store.get('sess',null);      // continuous-release session {start, ping}
let DAYS=store.get('days',{});        // {date:{ms, quick:{want:n}}}
let LOG=store.get('log',[]);          // [{date,time,kind,...}]
let ACTIVE=store.get('active',{});
const save=()=>{store.set('cfg',CFG);store.set('sess',SESS);store.set('days',DAYS);store.set('log',LOG);store.set('active',ACTIVE)};
const day=k=>DAYS[k]||(DAYS[k]={ms:0,quick:{}});
function touch(){ACTIVE[today()]=1}
function streak(){let n=0;const d=new Date();if(!ACTIVE[ymd(d)])d.setDate(d.getDate()-1);while(ACTIVE[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function msToday(){let ms=(DAYS[today()]||{}).ms||0;if(SESS){const m=new Date();m.setHours(0,0,0,0);ms+=Date.now()-Math.max(SESS.start,m.getTime())}return ms}
function quickToday(){return (DAYS[today()]||{}).quick||{}}
function nToday(){return Object.values(quickToday()).reduce((a,b)=>a+b,0)+LOG.filter(l=>l.date===today()&&l.kind==='flow').length}
function startSess(){SESS={start:Date.now(),ping:Date.now()};touch();save();lockOn();chime(true)}
function stopSess(){if(!SESS)return;const m=new Date();m.setHours(0,0,0,0);const d=day(today());d.ms+=Date.now()-Math.max(SESS.start,m.getTime());
  LOG.push({date:today(),time:hm(new Date(SESS.start)),kind:'sess',ms:Date.now()-SESS.start});SESS=null;save();lockOff()}
function quick(k){hap('release');const d=day(today());d.quick[k]=(d.quick[k]||0)+1;LOG.push({date:today(),time:hm(new Date()),kind:'quick',want:k});if(SESS)SESS.ping=Date.now();touch();save();chime(true)}

/* sound, vibration, screen awake */
let AC=null;function chime(soft){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=soft?528:660;
  g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(soft?.04:.12,AC.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1.6);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+1.7)}catch(e){}
  }
let WL=null;async function lockOn(){try{WL=await navigator.wakeLock.request('screen')}catch(e){}}function lockOff(){try{WL&&WL.release()}catch(e){}WL=null}
document.addEventListener('visibilitychange',()=>{if(SESS&&document.visibilityState==='visible'&&!WL)lockOn()});

/* ---------- screens ---------- */
let TAB='home';
const TABS=[['home','释放','orb'],['know','识别','eye'],['log','记录','chart'],['set','设置','gear']];
const V={};
V.home=()=>{const ms=msToday(),gp=Math.min(100,ms/(CFG.goal*36e5)*100),aw=Math.round(ms/(CFG.awake*36e5)*100),qt=quickToday(),st=streak(),n=new Date();
  const q=QUOTES.length?QUOTES[(n.getDate()*7+n.getHours())%QUOTES.length]:null;
  return `<div class="top"><span class="meta">${n.getMonth()+1} 月 ${n.getDate()} 日 · 今天释放 ${nToday()} 次</span><span class="r"><span class="streak">${st?icon('flame',1)+'连续 '+st+' 天':''}</span><button class="iconbtn" id="themeq" aria-label="切换夜间模式">${icon(isDark()?'sun':'moon')}</button></span></div>
  <section class="today"><div class="split"><span class="k">今天的释放时间 · 目标 ${CFG.goal} 小时</span>${SESS?`<span class="live k"><i class="breathe"></i><span id="clock">${clock(Date.now()-SESS.start)}</span></span>`:''}</div>
    <div class="split" style="align-items:flex-end"><span class="big" id="todayms">${fmt(ms)}</span><span class="k" id="awake">清醒时间的 ${aw}%</span></div>
    <div class="bar"><i id="gbar" style="width:${gp}%"></i></div>
    <div class="row">${SESS?`<button class="btn ghost" id="stop">结束这段</button><span class="k">开着的时间都计入。觉察到想要，就点下面放掉。</span>`:`<button class="btn" id="start">开始持续释放</button><span class="k">工作、走路、做家务时开着</span>`}</div></section>
  <section class="sect"><h2>觉察到想要，点一下放掉</h2>
    <div class="quick">${QUICK.map(x=>`<button class="q" data-q="${x.k}"><b>${x.k}</b><small>${x.s}</small><span class="n" data-n="${x.k}">${qt[x.k]||''}</span></button>`).join('')}</div>
    <p class="cap">“你会审视每一个出现的感受，看到它是想要被认同、想要控制、还是想要安全，然后让它离开。” 1983 年在圣多纳的谈话</p></section>
  <div class="orbbox"><button class="orbbtn" id="open" aria-label="一步一步释放一件事"><span class="orb3d" data-scale=".92"></span><span class="lbl">释放一件事<small>一步一步，放到 0</small></span></button></div>
  ${q?`<button class="card" id="nextq" style="text-align:left;display:flex;flex-direction:column;gap:8px"><p class="quote">${esc(q.q)}</p><span class="cap">${qsrc(q)} · 点一下换一句</span></button>`:''}`};

V.know=()=>`<h1>识别</h1><p class="meta">感受升起时，先说出它是什么，再看它底下是哪一个想要。</p>
  <section class="ref"><h2>三大想要</h2><p class="cap">“AGFLAP 来自于两个，被称作想要被认同、想要控制，这两个又来自于一个，称为想要安全/想要生存。” 私教课，第 95 页</p>
  ${WANTS.map((w,i)=>`<div class="wcard"><span class="h"><b>${w}</b></span><ul>${WANTP[i].ask.map(a=>`<li>${a}</li>`).join('')}</ul><span class="say">${WANTP[i].say.map(t=>`<span>“${t}”</span>`).join('')}</span></div>`).join('')}
  <div class="wcard"><span class="h"><b>卡住、说不清的时候</b></span><p style="font-size:14px">释放“想要改变这个感受”。不管它是什么，让想要改变它的那股劲离开。</p><p class="cap">“释放“想要改变这个模糊不清的感受”——不管它是什么。” The Way《Lesson 1》</p></div></section>
  <section class="ref"><h2>情绪表</h2><p class="cap">参考 1992 年圣多纳课程的情绪表整理。下面六种合称 AGFLAP，放下它们，就上升到无畏、接纳、平和（CAP）。</p>
  <div class="emo">${CAP.map((x,i)=>`<div class="lv"><b style="color:var(--tint)">${x.k}<small>${x.en}</small></b><div class="words">${CAPW[i].map(w=>`<button disabled style="color:var(--tint)">${w}</button>`).join('')}</div></div>`).reverse().join('')}
  ${FEEL.map((x,i)=>`<div class="lv"><b>${x.k}<small>${x.en}</small></b><div class="words">${EMO[i].map(w=>`<button data-go="${i}" data-w="${w}">${w}</button>`).join('')}</div></div>`).reverse().join('')}</div>
  <p class="cap">点一个词，直接从它开始释放。</p></section>`;

V.log=()=>{const days=[...Array(7)].map((_,i)=>{const k=addDays(i-6);return{k,ms:k===today()?msToday():(DAYS[k]||{}).ms||0}});const mx=Math.max(CFG.goal*36e5,...days.map(d=>d.ms));
  const fl=LOG.filter(l=>l.kind==='flow'),dr=fl.filter(l=>l.before!=null&&l.after!=null),avg=dr.length?(dr.reduce((a,l)=>a+(l.before-l.after),0)/dr.length).toFixed(1):'–';
  const cnt=f=>{const m={};LOG.forEach(l=>f(l).forEach(k=>m[k]=(m[k]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3)};
  const fe=cnt(l=>l.kind==='flow'?(l.words&&l.words.length?l.words:(l.word?[l.word]:[])):[]),wa=cnt(l=>l.kind==='quick'?[l.want]:(l.kind==='flow'?Object.keys(l.wants||{}):[]));

  <section class="list"><div><span class="grow"><span>最常放下的想要</span><small>${wa.map(([k,n])=>k+' ×'+n).join('、')||'还没有'}</small></span></div><div><span class="grow"><span>最常出现的感受</span><small>${fe.map(([k,n])=>k+' ×'+n).join('、')||'还没有'}</small></span></div></section>

  <div class="row"><button class="btn sm" id="copy">复制全部记录</button><span class="cap" id="msg"></span></div>`};

const segc=(key,opts)=>{const idx=Math.max(0,opts.findIndex(o=>o[0]===CFG[key]));return `<div class="seg" data-seg="${key}" style="--n:${opts.length}"><span class="thumb" style="width:calc((100% - 4px)/${opts.length});transform:translateX(${idx*100}%)"></span>${opts.map(([v,l])=>`<button data-set="${key}" data-v="${v}" class="${CFG[key]===v?'on':''}">${l}</button>`).join('')}</div>`};

/* ---------- haptics, press feedback, theme ---------- */
// Android: Vibration API with different patterns. iPhone (iOS 18+): toggling a native switch gives the system haptic tick.
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let HAPT=null;
const HP={tick:8,tap:14,release:[18,40,10],success:[12,60,24],warn:[30,70,30]};
function hap(kind){if(!CFG.haptic)return;try{if(navigator.vibrate&&!IOS){navigator.vibrate(HP[kind]||8);return}}catch(e){}
  if(IOS){try{if(!HAPT){HAPT=document.createElement('label');HAPT.className='hapt';HAPT.setAttribute('aria-hidden','true');HAPT.innerHTML='<input type="checkbox" switch tabindex="-1">';document.body.appendChild(HAPT)}HAPT.click();
    if(kind==='success'||kind==='warn'||kind==='release')setTimeout(()=>HAPT.click(),90)}catch(e){}}}
const TAPSEL='button,.q,.wcard,.orbbtn,a';
document.addEventListener('pointerdown',e=>{const t=e.target.closest(TAPSEL);if(!t||t.disabled)return;t.classList.add('tap','down');
  const up=()=>{t.classList.remove('down');window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up)};window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)},{passive:true});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(t&&!t.disabled&&!t.dataset.h)hap('tick')},true);
const isDark=()=>CFG.theme==='dark'||(CFG.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(){const r=document.documentElement;if(CFG.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',CFG.theme);
  let m=document.querySelector('meta[name=theme-color]');if(m)m.content=isDark()?'#040706':'#eaf2ef'}
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();if(!F)render()});

/* ---------- motion helpers (skipped when the viewer prefers reduced motion) ---------- */
const CALM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function center(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2,r.width,r.height]}
function wave(el,n,scale){if(CALM||!el)return;const [x,y,w]=center(el);for(let i=0;i<(n||2);i++){const s=document.createElement('span');s.className='wave';
  s.style.cssText=`left:${x}px;top:${y}px;width:${w*(scale||1)}px;height:${w*(scale||1)}px;animation-delay:${i*.18}s`;document.body.appendChild(s);s.addEventListener('animationend',()=>s.remove())}}
function motes(el,n){if(CALM||!el)return;const [x,y,w,h]=center(el);for(let i=0;i<(n||8);i++){const s=document.createElement('span');s.className='mote';
  const dx=(Math.random()-.5)*w*.9;s.style.cssText=`left:${x+dx}px;top:${y+(Math.random()-.3)*h*.4}px;--x:${(Math.random()-.5)*60}px;--y:${90+Math.random()*120}px;--d:${1.2+Math.random()*1.2}s;width:${4+Math.random()*5}px;height:${4+Math.random()*5}px`;
  document.body.appendChild(s);s.addEventListener('animationend',()=>s.remove())}}
function plus(el,txt){if(CALM||!el)return;const r=el.getBoundingClientRect(),s=document.createElement('span');s.className='plus';s.textContent=txt||'+1';
  s.style.cssText=`left:${r.right-28}px;top:${r.top+6}px`;document.body.appendChild(s);s.addEventListener('animationend',()=>s.remove())}
function bump(el){if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function countTo(el,from,to){if(!el)return;if(CALM||from===to){el.textContent=to;return}let v=from;const st=from>to?-1:1;el.textContent=v;
  const t=setInterval(()=>{v+=st;el.textContent=v;if(v===to)clearInterval(t)},Math.max(70,600/Math.abs(to-from)))}

/* ---------- guided release (full screen) ---------- */
let F=null;
const newF=()=>({step:1,dir:1,mode:'feel',topic:'',sel:[],lvl:null,word:null,before:6,cur:null,wants:{},rounds:0,deep:false,after:null,state:null,saved:null});
function openFlow(pre){F=Object.assign(newF(),pre||{});if(F.sel.length){F.lvl=F.sel[0].l}
  $('#layer').innerHTML=`<div class="fx" id="fx" role="dialog" aria-label="释放一件事"><div class="fx-top"><button class="iconbtn" id="x" aria-label="关闭">${icon('close')}</button><div class="segs" id="segs"></div><span class="cap" id="stepname" style="width:2.6em;text-align:right"></span></div>

const curName=()=>F.cur==='change'?CHANGE:WANTS[F.cur];

function hintFor(i){const ws=F.sel.filter(s=>HINT[s.l].includes(i)).map(s=>s.w);return ws.length?`常见于${ws.slice(0,2).join('、')}${ws.length>2?'等':''}`:''}
function trayHTML(){return F.sel.length?`${esc(selWords())} <em>· ${F.sel.length} 个</em>`:'<em>点选一个或几个词</em>'}
function paintF(){

    ${WANTS.map((w,i)=>{const hn=F.sel.length?hintFor(i):(F.lvl!=null&&HINT[F.lvl].includes(i)?FEEL[F.lvl].k+'常见':'');return `<button class="wcard" data-want="${i}"><span class="h"><b>${w}</b>${hn?`<span class="badge">${esc(hn)}</span>`:''}</span><ul>${WANTP[i].ask.map(a=>`<li>${a}</li>`).join('')}</ul><span class="say">${WANTP[i].say.map(t=>`<span>“${t}”</span>`).join('')}</span></button>`}).join('')}

    f=`<button class="btn" data-step="1">上一步</button><span class="cap">点一项就会继续</span>`}
  if(F.step===3){h=F.cur==='change'?'释放想要改变它':'允许它浮现，然后放下';
    const sz=Math.max(64,220-F.rounds*28),op=Math.max(.32,1-F.rounds*.09);
    const word=F.rounds===0?(F.cur==='change'?'不管它是什么，<br>让“想要改变它”的那股劲离开。':`感受这份${curName()}。<br>允许它完全浮现上来，<br>然后让它离开。`):(F.rounds<3?'还有剩下的吗？<br>有的话，再放一次。':'像波浪一样，浮现，离开，<br>直到波浪停止。');
    const deep=!F.deep&&F.rounds>=3&&(F.wants['想要被认同']||F.wants['想要控制'])&&F.cur!==2;
    b=`${F.sel.length?`<div class="fading" id="fading" style="--fo:${Math.max(.2,1-F.rounds*.16)};--fb:${Math.min(3,F.rounds*.5)}px">${F.sel.map(s=>`<span>${esc(s.w)}</span>`).join('')}</div>`:''}
      <div class="stage"><div class="ball" id="ball"><span class="orb3d" data-scale="${(sz/240).toFixed(3)}" data-alpha="${op}"></span></div><p class="say-big" id="words">${word}</p>
      <p class="cap" id="tally">${Object.entries(F.wants).map(([k,n])=>k+' ×'+n).join(' · ')||'还没放下'}</p>

      ${deep?`<div class="note pop-in"><p>当你释放了那些，在它们底端的“对死亡的恐惧”，就会自然地、明显可察觉地浮现出来，给你去释放。</p><p class="cap" style="margin:4px 0 10px">The Way《Lesson 1》</p><button class="btn sm" id="deep">往下看一层：想要安全</button></div>`:''}`;
    f=`<button class="btn solid" id="let" style="flex:1">放下了</button><button class="btn" id="tocheck" ${F.rounds?'':'disabled'}>轻了</button>`}
  if(F.step===4){h='还剩几分？';if(F.after==null)F.after=Math.max(0,F.before-3);
    b=`<div class="meter"><div class="split"><span class="meta">之前是 ${F.before}</span><b class="mnum" id="av">${F.after}</b></div><input type="range" id="after" min="0" max="10" value="${F.after}" aria-label="现在的强度"><div class="split cap"><span>0 干净了</span><span>10</span></div></div>
    <div class="note" id="clean" ${F.after>0?'':'hidden'}><p>还剩一点，说明想要还在。想要的感觉就是“没有”，留着它就会一直想要。</p><p class="cap" style="margin:4px 0 10px">“你们有没有特别注意去持续释放欲望，放走更多、放走更多、放走更多，直到没有更多？” The Right Path 开篇</p><button class="btn sm acc" id="more">继续放到 0</button></div>
    <p class="meta">现在最接近哪一种？（可不选）</p>
    <div class="levels">${[...CAP.slice().reverse().map(x=>[x.k,1]),...FEEL.slice().reverse().map(x=>[x.k,0])].map(([k,c])=>`<button class="${c?'cap-l':''} ${F.state===k?'on':''}" data-state="${k}">${k}</button>`).join('')}</div>`;

  if(F.step===5){const s=F.saved,d=s.before-s.after;h=d>0?`轻了 ${d} 分`:'记下来了';
    b=`<div class="stage"><div class="ball" id="ball" style="width:180px;height:180px"><span class="orb3d" data-scale="1"></span></div><p class="done-num"><span id="from">${s.before}</span> → <span id="to">${s.before}</span></p>
      <p class="meta" style="text-align:center">${esc(s.word||'')}${s.topic?' · '+esc(s.topic):''}${s.state?' → '+esc(s.state):''}</p><p class="cap" style="text-align:center">放下了 ${s.rounds} 次：${Object.entries(s.wants).map(([k,n])=>k+' ×'+n).join('、')}</p></div>
      <div class="note">“从现在开始，任何你想要的东西，都通过释放来得到它。” <span class="cap">The Way《Lesson 1》</span></div>`;

  $('#segs').innerHTML=[1,2,3,4].map(k=>`<i class="${k<=st||F.step===5?'on':''}"></i>`).join('');

  const body=$('#fxbody');body.innerHTML=`<div class="fx-in ${F.dir>0?'fwd':'back'}"><h1>${h}</h1>${b}</div>`;body.scrollTop=0;

function go(s){F.dir=s>=F.step?1:-1;F.step=s;paintF()}
function bindF(){const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};

  const fd=$('#find');if(fd)fd.oninput=()=>{const q=fd.value.trim();$$('#emo .lv').forEach(l=>{let any=false;l.querySelectorAll('[data-word]').forEach(b=>{const m=q&&b.dataset.word.includes(q);b.classList.toggle('hit',!!m);any=any||m});l.classList.toggle('dim',!!q&&!any)})};

    const o=$('#ball');wave(o,2,.75);motes(o,10);
    if(F.rounds===3&&!F.deep&&(F.wants['想要被认同']||F.wants['想要控制'])){setTimeout(()=>{F.dir=0;paintF()},450);return}
    const ob=orbOf('#ball');if(ob){ob.pulse(1);ob.setTarget(Math.max(64,220-F.rounds*28)/240,Math.max(.4,1-F.rounds*.08))}
    const fa=$('#fading');if(fa){fa.style.setProperty('--fo',Math.max(.2,1-F.rounds*.16));fa.style.setProperty('--fb',Math.min(3,F.rounds*.5)+'px')}
    const wd=$('#words');wd.classList.remove('fadeswap');void wd.offsetWidth;wd.classList.add('fadeswap');
    wd.innerHTML=F.rounds<3?'还有剩下的吗？<br>有的话，再放一次。':'像波浪一样，浮现，离开，<br>直到波浪停止。';
    $('#tally').textContent=Object.entries(F.wants).map(([k,n])=>k+' ×'+n).join(' · ');$('#tocheck').disabled=false});
  on('#other',()=>{if(F.lvl==null)F.lvl=2;go(2)});on('#stuck',()=>{F.cur='change';F.dir=0;paintF()});on('#deep',()=>{F.deep=true;F.cur=2;F.dir=1;paintF()});
  on('#tocheck',()=>go(4));
  const af=$('#after');if(af)af.oninput=()=>{hap('tick');F.after=+af.value;$('#av').textContent=af.value;bump($('#av'));$('#clean').hidden=!(F.after>0)};
  on('#more',()=>{if(F.orig==null)F.orig=F.before;F.before=F.after;F.after=null;go(F.cur==='change'||F.lvl==null?3:2)});
  on('#back3',()=>{F.after=null;go(3)});
  $$('[data-state]').forEach(b=>b.onclick=()=>{F.state=F.state===b.dataset.state?null:b.dataset.state;$$('[data-state]').forEach(x=>x.classList.toggle('on',x.dataset.state===F.state))});
  on('#save',()=>{const rec={date:today(),time:hm(new Date()),kind:'flow',mode:F.mode,topic:F.topic,word:selWords()||(F.lvl!=null?FEEL[F.lvl].k:''),words:F.sel.map(s=>s.w),
      level:selLevels().map(l=>FEEL[l].k).join('、')||(F.lvl!=null?FEEL[F.lvl].k:''),before:F.orig??F.before,after:F.after,state:F.state,rounds:F.rounds,wants:F.wants};
    LOG.push(rec);touch();save();F.saved=rec;hap('success');go(5)});
}

  if(CFG.every&&now-SESS.ping>=CFG.every*60000){SESS.ping=now;save();ping()}},1000);


/* ---------- 3D orb: a WebGL sphere with liquid interior, driven by spring physics ---------- */
const ORB_VS='attribute vec2 a;varying vec2 v;void main(){v=a;gl_Position=vec4(a,0.,1.);}';
const ORB_FS=`precision mediump float;varying vec2 v;
uniform float t,s,q,e,dk,al,aa;uniform vec2 L;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float a=.5,r=0.;for(int i=0;i<4;i++){r+=a*n(p);p*=2.03;a*=.5;}return r;}
void main(){
  vec2 p=v/(s*.9);p.x/=1.+q;p.y/=1.-q*.9;
  float r=length(p);float A=1.-smoothstep(1.-aa,1.,r);if(A<=0.)discard;
  float z=sqrt(max(0.,1.-r*r));vec3 N=normalize(vec3(p,z));
  vec2 fp=p*1.5+vec2(t*.04,-t*.055);float f=fbm(fp+fbm(fp*1.3+t*(.03+e*.25))*1.6+e*.6);
  N=normalize(N+vec3((f-.5)*.22*(.5+e),(fbm(fp.yx+3.1)-.5)*.22*(.5+e),0.));
  vec3 deep=mix(vec3(.07,.40,.30),vec3(.10,.46,.36),dk),mid=mix(vec3(.30,.70,.56),vec3(.32,.78,.62),dk),lite=mix(vec3(.80,.94,.88),vec3(.70,.95,.85),dk);
  float g=clamp(p.y*.55+.5+(f-.5)*.7,0.,1.);
  vec3 base=mix(deep,mid,smoothstep(0.,.55,g));base=mix(base,lite,smoothstep(.55,1.,g)*.75);
  vec3 Ld=normalize(vec3(L,1.1));
  float dif=.62+.38*max(dot(N,Ld),0.);
  vec3 H=normalize(Ld+vec3(0.,0.,1.));
  float sp=pow(max(dot(N,H),0.),70.)*.55+pow(max(dot(N,H),0.),9.)*.12;
  float fr=pow(1.-z,2.6);
  vec3 col=base*dif+vec3(1.)*sp+mix(vec3(.82,1.,.93),vec3(.6,1.,.86),dk)*fr*.5;
  col+=vec3(.75,1.,.9)*pow(clamp(-p.y*.9+.1,0.,1.),3.)*.18*(1.-z*.4);
  col+=vec3(1.)*smoothstep(.985,1.,r)*.25;
  gl_FragColor=vec4(col*A*al,A*al);
}`;
const ORBS=new Set();let orbRAF=0,orbLast=0;
function makeOrb(host){
  const cv=document.createElement('canvas');cv.className='orbgl';host.appendChild(cv);
  const gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:true});
  if(!gl){cv.remove();const sp=document.createElement('span');sp.className='orb breathe';host.appendChild(sp);return null}
  const sh=(type,src)=>{const o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);return o};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,ORB_VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,ORB_FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.remove();const sp=document.createElement('span');sp.className='orb breathe';host.appendChild(sp);return null}
  gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  const U={};['t','s','q','e','dk','al','aa','L'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
  const o={host,cv,gl,U,s:+(host.dataset.scale||1)*.85,vs:0,target:+(host.dataset.scale||1),q:0,vq:0,e:0,al:0,alT:+(host.dataset.alpha||1),lx:-.7,ly:.85,lxT:-.7,lyT:.85,born:performance.now()/1000,breath:host.dataset.still?0:1,
    setTarget(x,a){o.target=x;if(a!=null)o.alT=a},
    pulse(k){if(CALM)return;o.vq+=(k||1)*2.4;o.e=Math.min(1.4,o.e+(k||1))},
    press(){if(CALM)return;o.vq-=.9;o.vs-=.35}};
  const rs=()=>{const d=Math.min(2,devicePixelRatio||1),w=Math.max(1,Math.round(cv.clientWidth*d)),h=Math.max(1,Math.round(cv.clientHeight*d));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}};rs();o.rs=rs;
  const mv=e=>{const r=cv.getBoundingClientRect();o.lxT=((e.clientX-r.left)/r.width-.5)*1.6;o.lyT=-((e.clientY-r.top)/r.height-.5)*1.6};
  host.addEventListener('pointermove',mv,{passive:true});host.addEventListener('pointerdown',e=>{mv(e);o.press()},{passive:true});
  host.addEventListener('pointerleave',()=>{o.lxT=-.7;o.lyT=.85},{passive:true});
  host._orb=o;ORBS.add(o);if(!orbRAF)orbRAF=requestAnimationFrame(orbTick);return o}
function orbTick(now){now/=1000;const dt=Math.min(.05,orbLast?now-orbLast:.016);orbLast=now;const dk=isDark()?1:0;
  for(const o of ORBS){if(!o.cv.isConnected){ORBS.delete(o);try{o.gl.getExtension('WEBGL_lose_context')?.loseContext()}catch(e){}continue}
    const t=now-o.born,br=CALM?1:1+.022*Math.sin(t*.9)*o.breath;
    o.vs+=(70*(o.target*br-o.s)-11*o.vs)*dt;o.s+=o.vs*dt;
    o.vq+=(-210*o.q-8*o.vq)*dt;o.q+=o.vq*dt;o.q=Math.max(-.25,Math.min(.25,o.q));
    o.e*=Math.exp(-dt*1.3);o.al+=(o.alT-o.al)*Math.min(1,dt*4);
    o.lx+=(o.lxT-o.lx)*Math.min(1,dt*5);o.ly+=(o.lyT-o.ly)*Math.min(1,dt*5);
    o.rs();const g=o.gl,U=o.U;g.viewport(0,0,o.cv.width,o.cv.height);g.clearColor(0,0,0,0);g.clear(g.COLOR_BUFFER_BIT);
    g.uniform1f(U.t,CALM?0:t);g.uniform1f(U.s,o.s);g.uniform1f(U.q,o.q);g.uniform1f(U.e,o.e);g.uniform1f(U.dk,dk);g.uniform1f(U.al,o.al);
    g.uniform1f(U.aa,3/Math.max(40,o.cv.width*o.s*.9));g.uniform2f(U.L,o.lx,o.ly);g.drawArrays(g.TRIANGLE_STRIP,0,4)}
  orbRAF=ORBS.size?requestAnimationFrame(orbTick):0;if(!orbRAF)orbLast=0}
function mountOrbs(root){(root||document).querySelectorAll('.orb3d:not(.on)').forEach(h=>{h.classList.add('on');makeOrb(h)})}
const orbOf=sel=>{const h=$(sel);return h&&(h._orb||(h.querySelector('.orb3d')||{})._orb)};

  $$('[data-tab]').forEach(b=>b.onclick=()=>{if(TAB===b.dataset.tab)return;hap('tick');const ni=TABS.findIndex(x=>x[0]===b.dataset.tab);$('#tabs .pill').style.transform=`translateX(${ni*100}%)`;TAB=b.dataset.tab;setTimeout(()=>{render(true);scrollTo(0,0)},CALM?0:120)});
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  on('#themeq',()=>{CFG.theme=isDark()?'light':'dark';save();applyTheme();render()});
  $$('[data-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.set,raw=b.dataset.v,v=isNaN(+raw)?raw:+raw;CFG[k]=v;save();if(k==='theme')applyTheme();
    const sg=b.closest('.seg');if(sg){const opts=[...sg.querySelectorAll('button')],ix=opts.indexOf(b);sg.querySelector('.thumb').style.transform=`translateX(${ix*100}%)`;opts.forEach(x=>x.classList.toggle('on',x===b));setTimeout(render,260)}else render()});
  on('#haptic',()=>{CFG.haptic=!CFG.haptic;save();const e=$('#haptic');e.classList.toggle('on',CFG.haptic);e.setAttribute('aria-checked',CFG.haptic);if(CFG.haptic)hap('tap')});
  on('#start',()=>{hap('tap');startSess();render();wave($('.today'),1,.5)});on('#stop',()=>{stopSess();render()});on('#open',()=>{const ho=orbOf('#open');if(ho)ho.pulse(.8);wave($('#open'),1,.8);setTimeout(()=>openFlow(),CALM?0:220)});
  $$('[data-q]').forEach(b=>b.onclick=()=>{quick(b.dataset.q);b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),350);const n=b.querySelector('[data-n]');n.textContent=quickToday()[b.dataset.q];bump(n);plus(b);wave(b,1,.7);motes($('#open'),5);const ho=orbOf('#open');if(ho)ho.pulse(.6);
    const t=$('.top .meta');if(t)t.textContent=t.textContent.replace(/今天释放 \d+ 次/,`今天释放 ${nToday()} 次`)});
  let qi=0;on('#nextq',()=>{if(!QUOTES.length)return;qi=(qi+1+Math.floor(Math.random()*QUOTES.length))%QUOTES.length;const q=QUOTES[qi];$('#nextq').innerHTML=`<p class="quote">${esc(q.q)}</p><span class="cap">${qsrc(q)} · 点一下换一句</span>`});
  $$('[data-go]').forEach(b=>b.onclick=()=>openFlow({sel:[{w:b.dataset.w,l:+b.dataset.go}]}));
  on('#copy',()=>{const txt=JSON.stringify({LOG,DAYS},null,1),m=$('#msg');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>m.textContent='已复制').catch(()=>{m.textContent='无法自动复制，请手动复制下方内容';const t=document.createElement('textarea');t.value=txt;m.after(t);t.select()})});
}
