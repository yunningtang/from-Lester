<title>莱斯特释放学堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: iOS grouped style. Plain grouped background, white inset cells, translucent glass only on floating bars (sidebar, nav bar, tab bar). */
:root{
  --bg:#f2f2f7; --cell:#ffffff; --fill:#e9e9ee; --label:#111114; --label2:#606066; --sep:rgba(60,60,67,.16);
  --tint:#0062cc; --tint-fill:rgba(0,98,204,.10); --green:#1f8a3d; --red:#c4302b;
  --glass:rgba(250,250,252,.72); --glass-edge:rgba(255,255,255,.7); --glass-shade:rgba(0,0,0,.06);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-read:"Noto Serif SC","Songti SC","STSong",serif;
  --t-large:34px; --t-title:22px; --t-body:17px; --t-sub:15px; --t-foot:13px;
  --r-cell:12px; --r-glass:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1c1c1e; --fill:#2c2c2e; --label:#f2f2f7; --label2:#a1a1a8; --sep:rgba(84,84,88,.5);
  --tint:#3d9bff; --tint-fill:rgba(61,155,255,.16); --green:#3ccf62; --red:#ff6b62;
  --glass:rgba(30,30,32,.68); --glass-edge:rgba(255,255,255,.10); --glass-shade:rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1c1c1e; --fill:#2c2c2e; --label:#f2f2f7; --label2:#a1a1a8; --sep:rgba(84,84,88,.5);
  --tint:#3d9bff; --tint-fill:rgba(61,155,255,.16); --green:#3ccf62; --red:#ff6b62;
  --glass:rgba(30,30,32,.68); --glass-edge:rgba(255,255,255,.10); --glass-shade:rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--label)}
body{margin:0;font-family:var(--f-ui);font-size:var(--t-body);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--tint);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
h1{font-size:var(--t-large);line-height:1.2;letter-spacing:.01em}
h2{font-size:var(--t-title);line-height:1.3}
h3{font-size:var(--t-body);font-weight:600}
p{margin:0;text-wrap:pretty}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-edge),0 4px 12px var(--glass-shade)}

.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);border-radius:var(--r-glass);padding:22px 12px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.side .name{font-size:var(--t-title);font-weight:700;padding:0 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--label);padding:8px 12px;border-radius:10px;font-size:var(--t-sub);display:flex;justify-content:space-between}
.nav a.on{background:var(--tint-fill);color:var(--tint);font-weight:600}
.nav a span{color:var(--label2);font-size:var(--t-foot);font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;padding:0 12px;font-size:var(--t-foot);color:var(--label2)}
main{min-width:0;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.page.narrow{gap:28px}
.head{display:flex;flex-direction:column;gap:8px}
.sub{color:var(--label2);font-size:var(--t-sub)}
.foot{color:var(--label2);font-size:var(--t-foot)}
.block{display:flex;flex-direction:column;gap:12px}

/* grouped inset list */
.list{background:var(--cell);border-radius:var(--r-cell);overflow:hidden}
.list>*{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--label);position:relative;min-height:48px}
.list>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.list a::after{content:"";width:8px;height:8px;border-right:2px solid var(--label2);border-top:2px solid var(--label2);transform:rotate(45deg);opacity:.5;flex:none;margin-left:4px}
.list .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list .grow small{color:var(--label2);font-size:var(--t-foot);line-height:1.45}
.list .val{color:var(--label2);font-size:var(--t-sub);font-variant-numeric:tabular-nums;flex:none}
.check{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--sep);display:grid;place-items:center}
.check.on{background:var(--green);box-shadow:none}
.check.on::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.pad{background:var(--cell);border-radius:var(--r-cell);padding:18px 18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;font-size:var(--t-sub);font-weight:600;background:var(--fill);color:var(--tint)}
.btn.pri{background:var(--tint);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;max-width:360px}
.seg button{padding:7px 10px;border-radius:8px;font-size:var(--t-foot);font-weight:600;color:var(--label)}
.seg button.on{background:var(--cell);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* home */
.quote{font-family:var(--f-read);font-size:24px;line-height:1.65;font-weight:600}
.src{color:var(--label2);font-size:var(--t-foot);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--sep);border-radius:var(--r-cell);overflow:hidden}
.stats div{background:var(--cell);padding:14px 16px;display:flex;flex-direction:column}
.stats b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{color:var(--label2);font-size:var(--t-foot)}
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tint);border-radius:3px}

/* scale of feelings */
.scale{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.scale div{border-radius:8px;background:var(--cell);padding:10px 4px;text-align:center;font-size:var(--t-foot);line-height:1.3;display:flex;flex-direction:column;gap:2px}
.scale div small{color:var(--label2);font-size:12px}
.scale .up{background:var(--tint-fill);color:var(--tint)}
.scale .up small{color:var(--tint)}

/* section */
.lede{font-size:19px;line-height:1.7}
.points{margin:0;padding:0;list-style:none}
.points li{padding:12px 16px;position:relative;line-height:1.6}
.points li+li::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.q{font-family:var(--f-read);font-size:19px;line-height:1.85;padding:18px 20px;background:var(--cell);border-radius:var(--r-cell)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;line-height:1.6}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--tint-fill);color:var(--tint);display:grid;place-items:center;font-size:var(--t-foot);font-weight:700;margin-top:2px}
.opt{width:100%;text-align:left;justify-content:space-between}
.opt.right{color:var(--green);font-weight:600}
.opt.wrong{color:var(--red)}
.reader{font-family:var(--f-read);font-size:18px;line-height:2;max-width:38em}
.reader p+p{margin-top:.8em}
.reader b{font-family:var(--f-ui);font-size:var(--t-sub);color:var(--tint);font-weight:600;margin-right:2px}
mark{background:rgba(255,204,0,.35);color:inherit;border-radius:3px;padding:0 1px}
textarea,input[type=text],input[type=search]{font:inherit;font-size:var(--t-body);color:var(--label);background:var(--cell);border:none;border-radius:var(--r-cell);padding:12px 16px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.6}
input[type=search]{background:var(--fill)}
.pager{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:var(--t-sub)}

/* workbench */
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.progress i{height:4px;border-radius:2px;background:var(--fill)}
.progress i.on{background:var(--tint)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--cell);border-radius:var(--r-cell);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.tile small{color:var(--label2);font-size:var(--t-foot);line-height:1.45}
.tile.on{box-shadow:inset 0 0 0 2px var(--tint)}
.calm{font-family:var(--f-read);font-size:26px;line-height:1.8;text-align:center;padding:40px 16px}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--fill)}
.cal i.l1{background:var(--tint-fill)} .cal i.l2{background:var(--tint)}
.tag{font-size:var(--t-foot);padding:2px 10px;border-radius:999px;background:var(--fill);color:var(--label)}
.tag.t{background:var(--tint-fill);color:var(--tint)}

/* mobile: glass tab bar + top bar */
.tabbar,.topbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:12px 130px}
  .tabbar{display:flex;position:fixed;z-index:6;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:6px;justify-content:space-around}
  .tabbar a{flex:1;text-align:center;font-size:var(--t-foot);font-weight:600;color:var(--label);padding:9px 2px;border-radius:999px}
  .tabbar a.on{background:var(--tint-fill);color:var(--tint)}
  h1{font-size:30px}
  .scale{grid-template-columns:repeat(3,minmax(0,1fr))}
  .quote{font-size:21px}
  .reader{font-size:17px}
}
@media (prefers-reduced-motion:no-preference){.page{animation:in .28s cubic-bezier(.22,1,.36,1) both}@keyframes in{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<div class="shell">
  <aside class="side glass">
    <div class="name">莱斯特释放学堂</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sidefoot"></div>
  </aside>
  <main id="main"><div class="page"><p class="sub">正在载入全书……</p></div></main>
</div>
<nav class="tabbar glass" id="tabbar"></nav>

<script src="data/book.js"></script>
<script src="data/notes.js"></script>
<script>
(function(){
const BOOK = window.BOOK || [], NOTES = window.NOTES || {sections:{},terms:[],stories:[]};
const SN = NOTES.sections || {};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){try{const v=localStorage.getItem('lester:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('lester:'+k,JSON.stringify(v))}catch(e){}}
};
let done=store.get('done',{}), journal=store.get('journal',[]), notes=store.get('notes',{}), quizlog=store.get('quiz',{});
const SECS=[]; BOOK.forEach(c=>c.sections.forEach(s=>{s.coll=c;SECS.push(s)}));
const byId=Object.fromEntries(SECS.map(s=>[s.id,s]));
const chars=s=>s.paras.reduce((a,p)=>a+p.length,0);
const TOTAL=SECS.reduce((a,s)=>a+chars(s),0);

const FEEL=[
  {k:'万念俱灰',en:'Apathy',d:'无力、麻木，觉得没有用'},
  {k:'悲苦',en:'Grief',d:'伤心、失落、自怜'},
  {k:'恐惧',en:'Fear',d:'担心、焦虑、不安'},
  {k:'贪求',en:'Lust',d:'渴求，非要不可'},
  {k:'愤怒',en:'Anger',d:'恼火、怨恨、想反击'},
  {k:'自尊自傲',en:'Pride',d:'优越、评判、不肯动'}];
const CAP=[{k:'无畏',en:'Courage'},{k:'接纳',en:'Acceptance'},{k:'平和',en:'Peace'}];
const WANTS=[
  {k:'想要被认同',d:'想被喜欢、被认可、被爱、被理解'},
  {k:'想要控制',d:'想改变它，想让事情按我的方式来'},
  {k:'想要安全/生存',d:'担心失去、受伤、活不下去'}];
const ROUTES=[['home','今天'],['learn','课程'],['release','释放'],['practice','练习库'],['quiz','自测'],['read','全文'],['glossary','概念与金句'],['journal','记录']];
const MOBILE=['home','learn','release','read','journal'];

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daySeed=()=>today().split('-').reduce((a,b)=>a*31+ +b,7);
const pick=(a,n)=>a[Math.abs(n)%a.length];
const stats=()=>({n:Object.keys(done).length,rel:journal.filter(j=>j.type==='release').length,days:new Set(journal.map(j=>j.date)).size});
const ALLQ=[];SECS.forEach(s=>{const n=SN[s.id];if(n&&n.quotes)n.quotes.forEach(q=>ALLQ.push({q,s}))});
const ALLP=SECS.filter(s=>SN[s.id]&&SN[s.id].practice).map(s=>({s,p:SN[s.id].practice}));
const ALLZ=SECS.filter(s=>SN[s.id]&&SN[s.id].quiz).map(s=>({s,z:SN[s.id].quiz}));
const START=(NOTES.start||[]).filter(id=>byId[id]);
const src=s=>`${esc(s.coll.title)}《${esc(s.title)}》，原书第 ${s.page} 页`;

const V={};
V.home=()=>{
  const st=stats(),seed=daySeed(),q=ALLQ.length?pick(ALLQ,seed):null,pr=ALLP.length?pick(ALLP,seed>>3):null,next=SECS.find(s=>!done[s.id]);
  const d=new Date();
  return `<div class="page">
  <div class="head"><h1>今天</h1><p class="sub">${d.getMonth()+1} 月 ${d.getDate()} 日 · 莱斯特·利文森教导合集，${BOOK.length} 个合集，${SECS.length} 节，约 ${Math.round(TOTAL/10000)} 万字</p></div>
  ${q?`<section><p class="quote">${esc(q.q)}</p><p class="src">${src(q.s)}</p></section>`:''}
  <div class="row"><a class="btn pri" href="#release">开始一次释放</a>${next?`<a class="btn" href="#s-${next.id}">继续：${esc(next.title)}</a>`:''}</div>
  <section class="block"><div class="stats"><div><b>${st.n}</b><span>已学小节 / ${SECS.length}</span></div><div><b>${st.rel}</b><span>释放次数</span></div><div><b>${st.days}</b><span>练习天数</span></div></div>
  <div class="meter" aria-label="课程进度"><i style="width:${(st.n/SECS.length*100).toFixed(1)}%"></i></div></section>
  ${START.length?`<section class="block"><h2>从这里开始</h2><p class="sub">六节入门，先了解莱斯特的发现，再学会方法本身。</p>
  <div class="list">${START.map(id=>{const s=byId[id];return `<a href="#s-${id}"><span class="check ${done[id]?'on':''}"></span><span class="grow"><span>${esc(s.title)}</span><small>${esc(s.coll.title)}</small></span></a>`}).join('')}</div></section>`:''}
  ${pr?`<section class="block"><h2>今日练习：${esc(pr.p.title)}</h2><div class="pad"><ol class="steps">${pr.p.steps.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol></div><p class="foot">出自 ${src(pr.s)} · <a href="#s-${pr.s.id}">读这一节</a></p></section>`:''}
  <section class="block"><h2>情绪的九个层级</h2><p class="sub">书中的情绪图表：下方六种合称 AGFLAP，释放它们，就上升到无畏、接纳、平和（CAP）。</p>
  <div class="scale">${FEEL.map(f=>`<div>${f.k}<small>${f.en}</small></div>`).join('')}${CAP.map(f=>`<div class="up">${f.k}<small>${f.en}</small></div>`).join('')}</div></section>
  <p class="foot">学习进度、笔记和释放记录只保存在这台设备的浏览器里。</p></div>`;
};

V.learn=()=>`<div class="page"><div class="head"><h1>课程</h1><p class="sub">按原书顺序排列。每一节有提炼、金句、练习、自测和完整原文。</p></div>
  ${BOOK.map(c=>{const n=c.sections.filter(s=>done[s.id]).length,ov=(NOTES.collections||{})[c.id];return `<section class="block">
    <div class="head" style="gap:4px"><h2>${esc(c.title)}</h2>${ov?`<p class="sub">${esc(ov)}</p>`:''}<p class="foot">已学 ${n} / ${c.sections.length}</p></div>
    <div class="list">${c.sections.map(s=>`<a href="#s-${s.id}"><span class="check ${done[s.id]?'on':''}"></span><span class="grow">${esc(s.title)}</span><span class="val">${s.page}</span></a>`).join('')}</div></section>`}).join('')}</div>`;

let tab='learn';
V.sec=id=>{
  const s=byId[id];if(!s)return V.learn();
  const n=SN[id]||{},i=SECS.indexOf(s),prev=SECS[i-1],next=SECS[i+1],z=n.quiz,a=quizlog[id];
  const learn=`
    ${n.summary?`<p class="lede">${esc(n.summary)}</p>`:'<p class="sub">这一节暂无提炼，请直接读原文。</p>'}
    ${n.points&&n.points.length?`<section class="block"><h2>要点</h2><ul class="points list">${n.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></section>`:''}
    ${n.quotes&&n.quotes.length?`<section class="block"><h2>原文</h2>${n.quotes.map(q=>`<p class="q">${esc(q)}</p>`).join('')}</section>`:''}
    ${n.practice?`<section class="block"><h2>练习：${esc(n.practice.title)}</h2><div class="pad"><ol class="steps">${n.practice.steps.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol></div>
      ${n.practice.note?`<p class="foot">${esc(n.practice.note)}</p>`:''}<div class="row"><a class="btn" href="#release">打开释放工作台</a></div></section>`:''}
    ${z?`<section class="block" id="qz"><h2>自测</h2><p>${esc(z.q)}</p>
      <div class="list">${z.options.map((o,k)=>`<button class="opt ${a!=null?(k===z.answer?'right':(k===a?'wrong':'')):''}" data-k="${k}" ${a!=null?'disabled':''}><span class="grow">${esc(o)}</span>${a!=null&&k===z.answer?'<span class="check on"></span>':''}</button>`).join('')}</div>
      ${a!=null?`<p class="sub">${esc(z.explain||'')}</p>`:''}</section>`:''}
    <section class="block"><h2>笔记</h2><textarea id="note" aria-label="笔记" placeholder="读完这一节，你看到了什么？">${esc(notes[id]||'')}</textarea></section>`;
  const text=`<div class="reader">${s.paras.map(p=>{const m=p.match(/^([^，。：:]{1,8})[：:](.*)$/);return m?`<p><b>${esc(m[1])}</b>${esc(m[2])}</p>`:`<p>${esc(p)}</p>`}).join('')}</div>`;
  return `<div class="page narrow">
    <a href="#learn" style="font-size:var(--t-sub)">‹ ${esc(s.coll.title)}</a>
    <div class="head"><h1>${esc(s.title)}</h1><p class="sub">原书第 ${s.page} 页 · ${chars(s).toLocaleString()} 字</p></div>
    <div class="seg" role="tablist"><button data-t="learn" class="${tab==='learn'?'on':''}">学习与练习</button><button data-t="text" class="${tab==='text'?'on':''}">完整原文</button></div>
    ${tab==='learn'?learn:text}
    <div class="row"><button class="btn ${done[id]?'':'pri'}" id="mark">${done[id]?'已学 · 取消标记':'标记为已学'}</button></div>
    <nav class="pager">${prev?`<a href="#s-${prev.id}">‹ ${esc(prev.title)}</a>`:'<span></span>'}${next?`<a href="#s-${next.id}">${esc(next.title)} ›</a>`:''}</nav></div>`;
};

let R=null;const resetR=()=>R={step:0,feel:null,topic:'',want:null,rounds:0,after:null};
V.release=()=>{
  if(!R)resetR();
  const T=['此刻，你感受到了什么？','它底下想要的是什么？','允许它浮现，然后放下','现在感觉怎么样？'];
  let b='';
  if(R.step===0)b=`<p class="sub">莱斯特说，表面的感受最终都汇聚成六种更沉重的感受。选最接近的一个就行。</p>
    <input type="text" id="rtopic" aria-label="关于什么事" value="${esc(R.topic)}" placeholder="关于什么事？（可不填）">
    <div class="tiles">${FEEL.map((f,i)=>`<button class="tile ${R.feel===i?'on':''}" data-feel="${i}"><span>${f.k}</span><small>${f.d}</small></button>`).join('')}</div>
    <div class="row"><button class="btn pri" id="rnext" ${R.feel==null?'disabled':''}>下一步</button></div>`;
  if(R.step===1)b=`<p class="sub">“AGFLAP 来自于两个，被称作想要被认同、想要控制，这两个又来自于一个，称为想要安全/想要生存。”（私教课，第 95 页）</p>
    <p>看着这份${esc(FEEL[R.feel].k)}，它来自哪一个“想要”？</p>
    <div class="tiles">${WANTS.map((w,i)=>`<button class="tile ${R.want===i?'on':''}" data-want="${i}"><span>${w.k}</span><small>${w.d}</small></button>`).join('')}</div>
    <div class="row"><button class="btn" id="rback">上一步</button><button class="btn pri" id="rnext" ${R.want==null?'disabled':''}>下一步</button></div>`;
  if(R.step===2)b=`<div class="pad calm">感受这份${esc(WANTS[R.want].k)}。<br>允许它完全浮现。<br>然后，让它离开。</div>
    <p class="sub" style="text-align:center">已放下 ${R.rounds} 次。如果还有剩下的，再放一次。</p>
    <div class="row" style="justify-content:center"><button class="btn pri" id="rlet">放下了一次</button><button class="btn" id="rswitch">底下还有别的想要</button><button class="btn" id="rnext" ${R.rounds?'':'disabled'}>轻了，下一步</button></div>
    <p class="foot" style="text-align:center">“审视每一个出现的感受，看到它是想要被认同、想要控制、还是想要安全，然后让它离开。”（1983 年在圣多纳的谈话）</p>`;
  if(R.step===3)b=`<p class="sub">选最接近现在的一个。还停在下面的话，可以再来一轮。</p>
    <div class="tiles">${[...FEEL,...CAP].map((f,i)=>`<button class="tile ${R.after===f.k?'on':''}" data-after="${f.k}"><span>${f.k}</span><small>${i>=6?'CAP':'AGFLAP'}</small></button>`).join('')}</div>
    <textarea id="rnote" aria-label="记录" placeholder="放下了什么？有什么新的看见？"></textarea>
    <div class="row"><button class="btn pri" id="rsave" ${R.after?'':'disabled'}>保存</button><button class="btn" id="ragain">再来一轮</button></div>`;
  const recent=journal.filter(j=>j.type==='release').slice(-3).reverse();
  return `<div class="page narrow"><div class="progress" aria-label="第 ${R.step+1} 步，共 4 步">${[0,1,2,3].map(k=>`<i class="${k<=R.step?'on':''}"></i>`).join('')}</div>
  <h1>${T[R.step]}</h1>${b}
  ${recent.length?`<section class="block" style="margin-top:12px"><h2>最近</h2><div class="list">${recent.map(logRow).join('')}</div></section>`:''}</div>`;
};
function logRow(j){
  if(j.type==='release')return `<div><span class="grow"><span class="row" style="gap:6px"><span class="tag">${esc(j.feel)}</span><span class="tag">${esc(j.want)}</span><span class="tag t">${esc(j.after)}</span></span>${j.topic?`<span>${esc(j.topic)}</span>`:''}${j.note?`<small>${esc(j.note)}</small>`:''}</span><span class="val">${j.date.slice(5)}</span></div>`;
  return `<div><span class="grow"><span>${esc(j.note)}</span></span><span class="val">${j.date.slice(5)}</span></div>`;
}

V.practice=()=>`<div class="page"><div class="head"><h1>练习库</h1><p class="sub">书中给出的 ${ALLP.length} 个具体方法，按原书顺序。</p></div>
  ${BOOK.map(c=>{const ps=ALLP.filter(x=>x.s.coll===c);if(!ps.length)return'';return `<section class="block"><h2>${esc(c.title)}</h2>
  ${ps.map(({s,p})=>`<details class="pad"><summary style="cursor:pointer;font-weight:600">${esc(p.title)}</summary><ol class="steps" style="margin-top:14px">${p.steps.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol>${p.note?`<p class="foot" style="margin-top:10px">${esc(p.note)}</p>`:''}<p class="foot" style="margin-top:10px">出自《${esc(s.title)}》 · <a href="#s-${s.id}">读这一节</a></p></details>`).join('')}</section>`}).join('')}</div>`;

let QZ=null;
V.quiz=()=>{
  if(!QZ){QZ={pool:[...ALLZ].sort(()=>Math.random()-.5).slice(0,10),i:0,score:0,ans:null}}
  if(!QZ.pool.length)return `<div class="page"><h1>自测</h1><p class="sub">暂无题目。</p></div>`;
  if(QZ.i>=QZ.pool.length)return `<div class="page narrow"><h1>${QZ.score} / ${QZ.pool.length}</h1><p class="sub">答错的题，回到那一节再读一遍原文。</p><div class="row"><button class="btn pri" id="qnew">再来 10 题</button></div></div>`;
  const {s,z}=QZ.pool[QZ.i],a=QZ.ans;
  return `<div class="page narrow"><div class="progress" style="grid-template-columns:repeat(${QZ.pool.length},1fr)">${QZ.pool.map((_,k)=>`<i class="${k<=QZ.i?'on':''}"></i>`).join('')}</div>
  <div class="head"><h2 style="font-size:24px">${esc(z.q)}</h2><p class="foot">出自 ${src(s)}</p></div>
  <div class="list">${z.options.map((o,k)=>`<button class="opt qopt ${a!=null?(k===z.answer?'right':(k===a?'wrong':'')):''}" data-k="${k}" ${a!=null?'disabled':''}><span class="grow">${esc(o)}</span>${a!=null&&k===z.answer?'<span class="check on"></span>':''}</button>`).join('')}</div>
  ${a!=null?`<p class="sub">${esc(z.explain||'')} <a href="#s-${s.id}">读这一节</a></p><div class="row"><button class="btn pri" id="qnext">下一题</button></div>`:`<p class="foot">第 ${QZ.i+1} 题，已答对 ${QZ.score} 题</p>`}</div>`;
};

let RQ=store.get('rq','');
V.read=()=>`<div class="page narrow"><div class="head"><h1>全文</h1><p class="sub">在全书 ${SECS.length} 节、约 ${Math.round(TOTAL/10000)} 万字中搜索。</p></div>
  <input type="search" id="rq" aria-label="搜索全文" placeholder="搜索，例如：对死亡的恐惧" value="${esc(RQ)}">
  <div class="row">${['想要被认同','想要控制','想要安全','对死亡的恐惧','安静心智','我是谁','业力','欲望','凯迪拉克'].map(k=>`<button class="tag" data-q="${k}" style="padding:6px 12px">${k}</button>`).join('')}</div>
  <div id="hits"></div></div>`;
function searchHTML(q){
  q=q.trim();if(!q)return '';
  const out=[];let total=0;
  for(const s of SECS)for(let i=0;i<s.paras.length;i++){const p=s.paras[i],k=p.indexOf(q);if(k>=0){total++;if(out.length<200)out.push({s,i,p,k})}}
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
  return `<p class="foot" style="margin-bottom:10px">${total} 处${total>200?'，显示前 200 处':''}</p><div class="list">`+out.map(({s,i,p,k})=>{
    const a=Math.max(0,k-50),b=Math.min(p.length,k+q.length+80);
    const t=(a?'…':'')+esc(p.slice(a,b)).replace(re,m=>`<mark>${m}</mark>`)+(b<p.length?'…':'');
    return `<a href="#p-${s.id}-${i}"><span class="grow"><span style="font-family:var(--f-read);font-size:var(--t-sub);line-height:1.7">${t}</span><small>${esc(s.title)} · 第 ${s.page} 页</small></span></a>`}).join('')+'</div>';
}

V.glossary=()=>`<div class="page narrow"><div class="head"><h1>概念与金句</h1></div>
  <div class="seg" id="gseg"><button data-g="t" class="on">概念</button><button data-g="s">故事</button><button data-g="q">金句</button></div>
  <div id="gbody">${gloss('t')}</div></div>`;
function gloss(g){
  if(g==='t')return `<div class="list">${(NOTES.terms||[]).map(t=>`<div><span class="grow"><span style="font-weight:600">${esc(t.term)}</span><small style="font-size:var(--t-sub);color:var(--label)">${esc(t.def)}</small>${(t.sections||[]).filter(id=>byId[id]).length?`<small>${t.sections.filter(id=>byId[id]).slice(0,5).map(id=>`<a href="#s-${id}">${esc(byId[id].title)}</a>`).join('、')}</small>`:''}</span></div>`).join('')}</div>`;
  if(g==='s')return `<div class="list">${(NOTES.stories||[]).map(t=>`<div><span class="grow"><span style="font-weight:600">${esc(t.title)}</span><small style="font-size:var(--t-sub);color:var(--label)">${esc(t.summary)}</small>${byId[t.section]?`<small><a href="#s-${t.section}">${esc(byId[t.section].title)}</a></small>`:''}</span></div>`).join('')}</div>`;
  return `<div class="list">${ALLQ.map(({q,s})=>`<div><span class="grow"><span style="font-family:var(--f-read);line-height:1.8">${esc(q)}</span><small><a href="#s-${s.id}">${esc(s.title)}</a> · 第 ${s.page} 页</small></span></div>`).join('')}</div>`;
}

V.journal=()=>{
  const days={};journal.forEach(j=>days[j.date]=(days[j.date]||0)+1);
  const cells=[],d=new Date();d.setDate(d.getDate()-55);
  for(let i=0;i<56;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),v=days[k]||0;cells.push(`<i class="${v>=3?'l2':v?'l1':''}" title="${k}：${v} 条"></i>`);d.setDate(d.getDate()+1)}
  const nl=Object.entries(notes).filter(([k,v])=>v&&byId[k]);
  return `<div class="page narrow"><div class="head"><h1>记录</h1><p class="sub">只保存在这台设备上。</p></div>
  <section class="block"><h2>最近 8 周</h2><div class="pad"><div class="cal">${cells.join('')}</div></div></section>
  <section class="block"><h2>今日反思</h2><textarea id="jtext" aria-label="今日反思" placeholder="今天哪个时刻你抓住了一个感受？放下了吗？"></textarea><div class="row"><button class="btn pri" id="jsave">保存</button></div></section>
  <section class="block"><h2>全部记录</h2>${journal.length?`<div class="list">${journal.slice().reverse().map(logRow).join('')}</div>`:'<p class="sub">还没有记录。去<a href="#release">释放</a>做第一次练习。</p>'}</section>
  ${nl.length?`<section class="block"><h2>小节笔记</h2><div class="list">${nl.map(([k,v])=>`<a href="#s-${k}"><span class="grow"><span>${esc(byId[k].title)}</span><small>${esc(v)}</small></span></a>`).join('')}</div></section>`:''}
  <div class="row"><button class="btn" id="jexport">复制全部记录</button><span class="foot" id="jmsg"></span></div></div>`;
};

function route(){
  const h=(location.hash||'#home').slice(1);let key=h,html;
  if(h.startsWith('s-')){key='learn';html=V.sec(h.slice(2))}
  else if(/^p-c\d+s\d+-\d+$/.test(h)){key='read';tab='text';html=V.sec(h.match(/^p-(c\d+s\d+)/)[1])}
  if(!html){if(!V[h]||h==='sec')key='home';html=V[key]()}
  $('#main').innerHTML=html;
  $('#nav').innerHTML=ROUTES.map(([k,t])=>`<a href="#${k}" class="${key===k?'on':''}">${t}${k==='learn'?`<span>${stats().n}/${SECS.length}</span>`:''}</a>`).join('');
  $('#tabbar').innerHTML=ROUTES.filter(r=>MOBILE.includes(r[0])).map(([k,t])=>`<a href="#${k}" class="${key===k?'on':''}">${t}</a>`).join('');
  $('#sidefoot').textContent=`释放 ${stats().rel} 次`;
  bind(h);
  if(h.startsWith('p-')){const el=$$('.reader p')[+h.split('-').pop()];if(el){el.scrollIntoView({block:'center'});el.innerHTML='<mark>'+el.innerHTML+'</mark>'}}
  else scrollTo(0,0);
}
function rerender(){const y=scrollY;route();scrollTo(0,y)}
function bind(h){
  const sid=h.startsWith('s-')?h.slice(2):(h.match(/^p-(c\d+s\d+)/)||[])[1];
  if(sid){
    $$('.seg [data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;rerender()});
    $('#mark').onclick=()=>{if(done[sid])delete done[sid];else done[sid]=today();store.set('done',done);rerender()};
    const ta=$('#note');if(ta)ta.oninput=()=>{notes[sid]=ta.value;store.set('notes',notes)};
    $$('#qz .opt').forEach(b=>b.onclick=()=>{quizlog[sid]=+b.dataset.k;store.set('quiz',quizlog);rerender()});
  }
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  if(h==='release'){
    const t=$('#rtopic');if(t)t.oninput=()=>R.topic=t.value;
    $$('[data-feel]').forEach(b=>b.onclick=()=>{R.feel=+b.dataset.feel;rerender()});
    $$('[data-want]').forEach(b=>b.onclick=()=>{R.want=+b.dataset.want;rerender()});
    $$('[data-after]').forEach(b=>b.onclick=()=>{const n=$('#rnote').value;R.after=b.dataset.after;rerender();$('#rnote').value=n});
    on('#rnext',()=>{R.step++;rerender()});on('#rback',()=>{R.step--;rerender()});on('#rlet',()=>{R.rounds++;rerender()});
    on('#rswitch',()=>{R.step=1;R.want=null;rerender()});on('#ragain',()=>{const k=R.topic;resetR();R.topic=k;rerender()});
    on('#rsave',()=>{const d=new Date();journal.push({type:'release',date:today(),time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),feel:FEEL[R.feel].k,want:WANTS[R.want].k,after:R.after,rounds:R.rounds,topic:R.topic,note:$('#rnote').value});store.set('journal',journal);resetR();rerender()});
  }
  if(h==='quiz'){
    $$('.qopt').forEach(b=>b.onclick=()=>{QZ.ans=+b.dataset.k;if(QZ.ans===QZ.pool[QZ.i].z.answer)QZ.score++;rerender()});
    on('#qnext',()=>{QZ.i++;QZ.ans=null;rerender()});on('#qnew',()=>{QZ=null;rerender()});
  }
  if(h==='read'){
    const inp=$('#rq'),hits=$('#hits');let tm;const go=()=>{RQ=inp.value;store.set('rq',RQ);hits.innerHTML=searchHTML(RQ)};
    inp.oninput=()=>{clearTimeout(tm);tm=setTimeout(go,250)};go();
    $$('[data-q]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.q;go()});
  }
  if(h==='glossary')$$('#gseg button').forEach(b=>b.onclick=()=>{$$('#gseg button').forEach(x=>x.classList.toggle('on',x===b));$('#gbody').innerHTML=gloss(b.dataset.g)});
  if(h==='journal'){
    on('#jsave',()=>{const v=$('#jtext').value.trim();if(!v)return;journal.push({type:'note',date:today(),note:v});store.set('journal',journal);rerender()});
    on('#jexport',()=>{const txt=JSON.stringify({journal,notes,done},null,1),msg=$('#jmsg');
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>msg.textContent='已复制').catch(()=>{msg.textContent='无法自动复制，请手动复制下方内容';const t=document.createElement('textarea');t.value=txt;msg.after(t);t.select()})});
  }
}
addEventListener('hashchange',()=>{if(!location.hash.startsWith('#p-'))tab='learn';route()});
route();
})();
</script>
